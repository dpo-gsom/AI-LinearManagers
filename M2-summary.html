<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что потеряла выжимка</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 814px; display: flex; flex-direction: column; }
.screen__body { display: flex; flex-direction: column; }
.case-card { padding: 0 2px; }
.case-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--dark); line-height: 1.25; margin-bottom: 6px; }
.case-text { font-size: 14px; line-height: 1.6; color: var(--slate); }
.bubble-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); margin-bottom: 4px; }
.bubble { font-size: 14px; line-height: 1.6; padding: 12px 16px; }
.bubble--user { background: var(--sand); border-radius: 16px 16px 4px 16px; color: var(--dark); margin-left: 8%; }
.bubble--ai { background: var(--white); border: 1.5px solid var(--border); border-left: 4px solid var(--red); border-radius: 4px 16px 16px 16px; color: var(--slate); margin-right: 4%; }
.bubble--doc { background: var(--cream); border: 1.5px dashed var(--border); border-radius: var(--radius-md); color: var(--slate); }
.bubble-wrap--user { text-align: right; }
.bubble-wrap--user .bubble { text-align: left; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { padding: 12px 14px; font-size: 14px; line-height: 1.45; color: var(--dark); }
.opt--locked { cursor: default; pointer-events: none; }
.fb-zone { min-height: 150px; }
.fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }
.sum-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.sum-row:last-of-type { border-bottom: none; }
.sum-row__name { flex: 1; color: var(--dark); line-height: 1.35; }
.sum-row__name small { display: block; font-size: 12px; color: var(--slate); }
.mark { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.mark--ok   { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
.mark--warn { background: var(--amber-bg); border: 1.5px solid var(--amber); color: var(--amber); }
.mark--bad  { background: var(--red-bg);   border: 1.5px solid var(--red);   color: var(--red);   }
.sum-verdict { font-size: 14px; line-height: 1.65; color: var(--slate); }
.sum-verdict b { color: var(--dark); }
@media (max-width: 560px) {
    .bubble--user { margin-left: 0; }
  .bubble--ai { margin-right: 0; }
  .fb-zone { min-height: 220px; }
}
  @media (max-width: 560px) { .screen { min-height: 1120px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* Модуль 2 · страница «Выжимка». Три выжимки, у каждой своя беда:
   пересказ темы вместо сути, разговор вместо решений, «уточнённая» цифра. */

var CFG = {
  title: 'Что потеряла ',
  titleSpan: 'выжимка',
  intro: 'Нейросеть сокращает быстро, но сама решает, что главное. Перед вами три выжимки, которые руководители получили от нейросети. В каждой что-то потерялось. Выберите, что написать нейросети дальше.',
  progressLabel: 'Выжимка',
  question: 'Что вы напишете нейросети?',
  nextLabel: 'Следующая выжимка',
  finalTitle: 'Как вы работали с выжимками',
  allRight: 'Вы <b>задаёте выжимке цель</b> и проверяете её по исходнику.',
  someWrong: 'Вернитесь к выжимкам:',
  summary: 'Просьба «сократи» даёт короткий текст, но не обязательно полезный. Скажите нейросети, <strong>для чего вам выжимка и что вы будете с ней делать</strong>. А всё, что пойдёт дальше — директору, команде, клиенту, — <strong>сверьте с исходником</strong>.'
};

var CASES = [
  {
    title: 'Регламент приёмки',
    text: 'Начальнику смены склада прислали новый регламент приёмки товаров на 12 страниц. Он попросил: «Сделай краткое содержание».',
    bubbles: [
      { who: 'ai', text: 'Регламент описывает обновлённый порядок приёмки товаров на складе. Документ включает требования к проверке сопроводительных документов, осмотру упаковки и оформлению расхождений. Регламент направлен на повышение качества приёмки и снижение числа ошибок.' }
    ],
    right: 'выжимка под задачу',
    options: [
      { t: '«Сократи до пяти пунктов, по одному на раздел регламента. Пиши простыми словами, без канцелярита, чтобы смена прочитала за минуту»', level: 'warn',
        fb: 'Станет короче и понятнее, но это всё ещё пересказ разделов. Смене нужно не «о чём регламент», а что делать иначе и с какой даты.' },
      { t: '«Перескажи регламент подробнее, раздел за разделом: смена должна знать все требования, а не только главное»', level: 'bad',
        fb: 'Получится второй регламент, только хуже. Читать его будет так же долго, а изменения для смены в нём не выделены.' },
      { t: '«Перечисли, что меняется для кладовщиков на приёмке: что делать иначе и с какой даты. К каждому пункту укажи раздел регламента»', level: 'ok',
        fb: 'Вы сказали, для кого выжимка и что в ней важно. Номера разделов помогут быстро проверить каждый пункт по тексту.' }
    ]
  },
  {
    title: 'Итоги планёрки',
    text: 'Руководитель отдела закупок загрузила расшифровку часовой планёрки и попросила: «Сделай выжимку для тех, кого не было».',
    bubbles: [
      { who: 'ai', text: 'На планёрке обсудили задержку поставки упаковки. Игорь рассказал о ситуации с поставщиком. Марина отметила, что запас на складе есть на две недели. Участники обсудили варианты: искать второго поставщика или договориться о частичной поставке. Также затронули вопрос отпусков в декабре.' }
    ],
    right: 'решения и ответственные',
    options: [
      { t: '«Разбей выжимку по темам планёрки: по каждой теме два-три предложения — что обсуждали и какие мнения прозвучали»', level: 'warn',
        fb: 'Будет аккуратный пересказ по темам, но тем, кого не было, нужно знать, что решили и что от них ждут. Мнения без решений — это та же расшифровка, только короче.' },
      { t: '«Сделай протокол: решение — ответственный — срок. Если ответственный или срок не названы, напиши „не назначен“ и ничего не придумывай»', level: 'ok',
        fb: 'Тем, кого не было, нужно знать, что решили и что от них ждут. А пометка «не назначен» не даст нейросети придумать ответственного и сразу покажет, что вы упустили на встрече.' },
      { t: '«Допиши к каждой теме решение и ответственного, исходя из обсуждения. Где решение не прозвучало, предложи самое логичное»', level: 'bad',
        fb: 'Нейросеть назначит ответственных, которых на встрече никто не назначал, и коллеги примут это за решение. Чего не было, помечайте «не назначен», а не додумывайте.' }
    ]
  },
  {
    title: 'Письмо поставщика',
    text: 'Менеджер попросил сделать выжимку длинного письма поставщика для директора. В самом письме сказано: «рассматриваем возможность скидки до 15% при заказе от 500 единиц».',
    bubbles: [
      { who: 'ai', text: 'Поставщик снижает цены на 15%. Новые условия начнут действовать со следующего месяца. Для получения скидки необходимо подтвердить заказ.' }
    ],
    question: 'Что вы сделаете с выжимкой?',
    right: 'сверка с исходником',
    options: [
      { t: 'Отправить директору, добавив строку: «Выжимка подготовлена нейросетью, подробности — в письме поставщика во вложении»', level: 'bad',
        fb: 'Директор прочитает выжимку, а не вложение, и решит, что скидка уже есть. А поставщик только «рассматривает возможность», и только при заказе от 500 единиц. «Со следующего месяца» нейросеть дописала сама.' },
      { t: '«Перепиши выжимку осторожнее: убери точные цифры и сроки, оставь общий смысл — поставщик готов обсуждать снижение цены»', level: 'warn',
        fb: 'Ошибка уйдёт вместе с самым важным: директору нужны размер скидки и условие — заказ от 500 единиц. Цифры нужны, только точные и с условиями.' },
      { t: '«Сверь выжимку с письмом. Какие утверждения в ней сильнее или увереннее, чем в оригинале? Приведи цитаты из письма»', level: 'ok',
        fb: 'Нейросеть сама найдёт, где «рассматриваем возможность» превратилось в «снижает». Цитаты всё равно проверьте глазами: цифры, сроки и условия — ваша ответственность.' }
    ]
  }
];

/* ─── Механика: выбор ответа, разбор, итоги ─── */

var state = { screen: 'intro', i: 0, answers: [] };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2 ');
  return s.replace(/ — /g, ' — ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1 ');
}

function rightIdx(c) {
  for (var k = 0; k < c.options.length; k++) if (c.options[k].level === 'ok') return k;
}

function lockedClass(idx, ans) {
  var c = CASES[state.i];
  var cls = 'card opt opt--locked';
  if (idx === rightIdx(c)) return cls + ' card--correct';
  if (idx === ans) return cls + (c.options[idx].level === 'warn' ? ' card--warning' : ' card--wrong');
  return cls + ' card--dimmed';
}

function optionsHtml() {
  var c = CASES[state.i];
  var ans = state.answers[state.i];
  var h = '<div class="options">';
  for (var k = 0; k < c.options.length; k++) {
    if (ans === undefined) h += '<div class="card card--interactive opt" data-opt="' + k + '" onclick="pick(' + k + ')">' + c.options[k].t + '</div>';
    else h += '<div class="' + lockedClass(k, ans) + '" data-opt="' + k + '">' + c.options[k].t + '</div>';
  }
  return h + '</div>';
}

var FB_CLASS = { ok: 'feedback--success', warn: 'feedback--warning', bad: 'feedback--error' };

function feedbackHtml(ans) {
  if (ans === undefined) return '<div class="hint">Выберите ответ — здесь появится разбор.</div>';
  var c = CASES[state.i];
  var o = c.options[ans];
  var head = o.level === 'ok' ? 'Верно · ' + c.right : (o.level === 'warn' ? 'Допустимо, но не лучший вариант' : 'Неверно · ' + c.right);
  return nb('<div class="feedback ' + FB_CLASS[o.level] + '">'
    + '<div class="feedback__head">' + head + '</div>'
    + '<div>' + o.fb + '</div>'
    + '</div>');
}

function progressHtml() {
  return '<div class="progress">'
    + '<div class="progress__meta">'
    +   '<span class="progress__label">' + CFG.progressLabel + '</span>'
    +   '<span class="progress__fraction"><em>' + (state.i + 1) + '</em> / ' + CASES.length + '</span>'
    + '</div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (state.i / CASES.length * 100) + '%"></div></div>'
    + '</div>';
}

var LABEL = { user: 'Промпт', ai: 'Ответ нейросети', doc: 'Исходные данные' };

function bubblesHtml(c) {
  var list = c.bubbles || [];
  var h = '';
  for (var k = 0; k < list.length; k++) {
    var b = list[k];
    var label = b.label || LABEL[b.who];
    h += '<div class="mt-sm bubble-wrap--' + b.who + '">'
      + '<div class="bubble-label">' + label + '</div>'
      + '<div class="bubble bubble--' + b.who + '">' + b.text + '</div>'
      + '</div>';
  }
  return h;
}

function renderIntro() {
  return '<div class="screen__body">'
    +   '<h1 class="page-title">' + CFG.title + '<span>' + CFG.titleSpan + '</span></h1>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">' + CFG.intro + '</p>'
    +   (CFG.introExtra || '')
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderQuestion() {
  var c = CASES[state.i];
  var ans = state.answers[state.i];
  return '<div class="screen__body">'
    +   progressHtml()
    +   '<div class="case-card mt-sm">'
    +     '<div class="case-title">' + c.title + '</div>'
    +     (c.text ? '<p class="case-text">' + c.text + '</p>' : '')
    +   '</div>'
    +   bubblesHtml(c)
    +   '<div class="question-text mt-md">' + (c.question || CFG.question) + '</div>'
    +   '<div id="optbox" class="mt-sm">' + optionsHtml() + '</div>'
    +   '<div id="fbbox" class="fb-zone mt-sm">' + feedbackHtml(ans) + '</div>'
    + '</div>'
    + '<div class="nav-bar">'
    +   '<button id="next-btn" class="btn btn--primary btn--full" onclick="next()"' + (ans === undefined ? ' disabled' : '') + '>'
    +     (state.i === CASES.length - 1 ? 'К итогам →' : CFG.nextLabel + ' →')
    +   '</button>'
    + '</div>';
}

var MARK = { ok: '✓', warn: '~', bad: '✕' };

function renderFinal() {
  var rows = '', misses = [];
  for (var n = 0; n < CASES.length; n++) {
    var c = CASES[n];
    var lv = c.options[state.answers[n]].level;
    if (lv !== 'ok') misses.push(c.right);
    rows += '<div class="sum-row">'
      + '<div class="sum-row__name">' + c.title + '<small>' + c.right.charAt(0).toUpperCase() + c.right.slice(1) + '</small></div>'
      + '<span class="mark mark--' + lv + '">' + MARK[lv] + '</span>'
      + '</div>';
  }
  var verdict = misses.length === 0 ? CFG.allRight : CFG.someWrong + ' <b>' + misses.join(', ') + '</b>.';
  return '<div class="screen__body">'
    +   '<h2 class="section-title">' + CFG.finalTitle + '</h2>'
    +   '<div class="divider"></div>'
    +   rows
    +   '<p class="sum-verdict mt-sm">' + verdict + '</p>'
    +   '<div class="legend-box">'
    +     '<span class="legend-tag">Итог</span>'
    +     CFG.summary
    +   '</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
}

function render() {
  var body;
  if (state.screen === 'intro') body = renderIntro();
  else if (state.screen === 'q') body = renderQuestion();
  else body = renderFinal();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function start() { state.screen = 'q'; state.i = 0; state.answers = []; render(); }

function pick(idx) {
  if (state.answers[state.i] !== undefined) return;
  state.answers[state.i] = idx;
  var opts = document.querySelectorAll('#optbox [data-opt]');
  for (var k = 0; k < opts.length; k++) { opts[k].className = lockedClass(k, idx); opts[k].onclick = null; }
  document.getElementById('fbbox').innerHTML = feedbackHtml(idx);
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function next() {
  if (state.i === CASES.length - 1) state.screen = 'final';
  else state.i++;
  render();
}

function restart() { state.screen = 'intro'; state.i = 0; state.answers = []; render(); }

render();
</script>
</body>
</html>
