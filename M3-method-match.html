<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Метод под вопрос</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 1146px; display: flex; flex-direction: column; }
  .screen__body { display: flex; flex-direction: column; }

  .row { margin-top: 10px; padding: 10px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); }
  .row__head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row__name { font-size: 14px; font-weight: 600; color: var(--dark); }
  .row__label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); }
  .row__q { font-size: 14px; line-height: 1.5; color: var(--dark); margin-top: 2px; }
  .row__sample { font-size: 12px; color: var(--slate); opacity: .8; margin-top: 2px; }
  .why-tag { font-size: 12px; font-weight: 600; color: var(--dark); white-space: nowrap; }
  .row--click { cursor: pointer; }
  .row--click:hover { background: var(--sand); }
  .row--open { box-shadow: 0 0 0 2px var(--dark); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 5px 10px; font-size: 12.5px; line-height: 1.3; color: var(--dark); border-radius: 18px; }
  .chip.card--selected { border-color: var(--red); background: var(--red-bg); }
  .chip--locked { cursor: inherit; pointer-events: none; }

  .fb-hint { font-size: 13px; color: var(--slate); margin-bottom: 6px; min-height: 20px; }
  .fb-zone { min-height: 130px; }
  .fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }
  .verdict { font-size: 14px; line-height: 1.6; color: var(--slate); margin-bottom: 8px; }
  .verdict b { color: var(--dark); }
  @media (max-width: 560px) { .screen { min-height: 1589px; } .fb-zone { min-height: 190px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* =========================================================
   Метод под вопрос
   Модуль 3 · страница «Найти закономерности».
   Классификация: вопрос руководителя → метод анализа.
   Последний вопрос с подвохом: данных слишком мало, считать не нужно.
   ========================================================= */

var ACTS = ['Аномалии', 'Взаимосвязь', 'ABC-анализ', 'Разложение', 'Не считать'];

var ROWS = [
  { name: 'Вопрос 1', sample: 'Клиентов у нас 140. На каких тратить время в первую очередь?', right: 2,
    ok: 'ABC-анализ делит клиентов на группы по вкладу в выручку. Обычно небольшая группа даёт большую часть продаж, с неё и начинают.',
    other: 'Здесь нужно разделить клиентов по вкладу в выручку. Это ABC-анализ.', spec: {} },
  { name: 'Вопрос 2', sample: 'Выручка упала на 15%. Клиентов стало меньше или они стали покупать меньше?', right: 3,
    ok: 'Выручка = число клиентов × средний чек. Разложение показывает, какой множитель дал падение. Без него нейросеть легко придумает причину сама.',
    other: 'Вопрос «из-за чего изменился показатель» решают разложением на факторы: выручка = клиенты × средний чек.',
    spec: { 1: 'Взаимосвязь ищут между двумя показателями на многих наблюдениях. Здесь нужно понять, из каких частей сложилось падение, — это разложение на факторы.' } },
  { name: 'Вопрос 3', sample: 'У одного сотрудника расходы на командировки втрое выше, чем у остальных. Это нормально?', right: 0,
    ok: 'Это поиск аномалии. Нейросеть найдёт выброс, но причину знаете вы: может, у сотрудника дальние регионы, а может, ошибка в данных.',
    other: 'Одно значение резко отличается от остальных — это аномалия. Её проверяют: ошибка в данных или реальное событие.', spec: {} },
  { name: 'Вопрос 4', sample: 'Связана ли скорость первого ответа клиенту с тем, купит ли он? За год 2 300 обращений.', right: 1,
    ok: 'Наблюдений достаточно, чтобы увидеть взаимосвязь. Попросите график-облако точек и помните: связь ещё не доказывает причину.',
    other: 'Вопрос «связано ли одно с другим» — это взаимосвязь. Данных достаточно: 2 300 обращений.',
    spec: { 4: '2 300 обращений хватит для расчёта. Мало данных — это когда наблюдений единицы или пара десятков.' } },
  { name: 'Вопрос 5', sample: 'В отделе шесть человек. Связано ли, сколько часов они учились, с их результатами?', right: 4,
    ok: 'По шести людям любая «связь» может оказаться случайностью. Лучше посмотреть на каждого сотрудника и поговорить с ним.',
    other: 'Шесть человек — слишком мало для расчёта. Нейросеть посчитает, но вывод будет случайным. Смотрите на каждого сотрудника отдельно.',
    spec: { 1: 'Нейросеть охотно посчитает взаимосвязь по шести людям и сделает вывод. Но на таких данных «связь» может оказаться случайностью. Честный ответ здесь — не считать.' } }
];

var state = { screen: 'intro', pick: [], checked: false, open: -1 };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2&nbsp;');
  return s.replace(/ — /g, '&nbsp;— ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1&nbsp;');
}

function grade(i) { return state.pick[i] === ROWS[i].right ? 'ok' : 'bad'; }
function fbText(i) {
  var r = ROWS[i], p = state.pick[i];
  if (p === r.right) return r.ok;
  return r.spec[p] || r.other;
}
function allPicked() { for (var i = 0; i < ROWS.length; i++) if (state.pick[i] === undefined) return false; return true; }

function chipClass(i, a) {
  var p = state.pick[i];
  if (!state.checked) return 'card card--interactive chip' + (p === a ? ' card--selected' : '');
  if (a === ROWS[i].right) return 'card chip chip--locked card--correct';
  if (a === p) return 'card chip chip--locked ' + 'card--wrong';
  return 'card chip chip--locked card--dimmed';
}
function rowClass(i) {
  if (!state.checked) return 'row';
  return 'row row--click' + (i === state.open ? ' row--open' : '');
}

function rowHtml(i) {
  var r = ROWS[i], chips = '';
  for (var a = 0; a < ACTS.length; a++)
    chips += '<div class="' + chipClass(i, a) + '" onclick="choose(' + i + ',' + a + ')">' + ACTS[a] + '</div>';
  return '<div id="row-' + i + '" class="' + rowClass(i) + '" onclick="openRow(' + i + ')">'
    + '<div class="row__head"><span class="row__label">' + r.name + '</span>'
    + (state.checked ? '<span class="why-tag">Почему? ›</span>' : '') + '</div>'
    + '<div class="row__q">' + r.sample + '</div>'
    + '<div class="chips" id="chips-' + i + '">' + chips + '</div></div>';
}

function verdictHtml() {
  var bad = [];
  for (var j = 0; j < ROWS.length; j++) if (grade(j) === 'bad') bad.push(j + 1);
  if (bad.length === 0) return 'Вы <b>подбираете метод под вопрос</b> и видите, когда считать бессмысленно.';
  return 'Перечитайте ' + (bad.length === 1 ? 'вопрос ' : 'вопросы ') + '<b>' + bad.join(', ') + '</b>: что именно ' + (bad.length === 1 ? 'в нём' : 'в них') + ' спрашивают?';
}

function zoneHtml() {
  if (!state.checked) return '<div class="hint">После проверки здесь появится разбор.</div>';
  var i = state.open, r = ROWS[i], g = grade(i);
  var cls = g === 'ok' ? 'feedback--success' : 'feedback--error';
  var head = g === 'ok' ? 'Верно' : 'Неверно';
  return '<p class="verdict">' + verdictHtml() + '</p>'
    + '<div class="feedback ' + cls + '">'
    + '<div class="feedback__head">' + head + ' · ' + r.name + ' — ' + ACTS[r.right] + '</div>'
    + fbText(i) + '</div>';
}

function renderIntro() {
  return '<div class="screen__body">'
    + '<h1 class="page-title">Метод <span>под вопрос</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Нейросеть посчитает почти что угодно. Но решать, какой метод подходит под вопрос и стоит ли вообще считать, — вам. Перед вами пять вопросов руководителя. Выберите для каждого метод.</p>'
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderTask() {
  var rows = '';
  for (var i = 0; i < ROWS.length; i++) rows += rowHtml(i);
  var bottom;
  if (!state.checked) {
    bottom = '<button id="check-btn" class="btn btn--primary btn--full mt-md" onclick="check()"' + (allPicked() ? '' : ' disabled') + '>Проверить →</button>';
  } else {
    bottom = '<div class="legend-box"><span class="legend-tag">Итог</span>'
      + 'Нейросеть — <strong>консультант по методу</strong>: попросите её предложить метод под вопрос, посчитать кодом и сказать, <strong>где выводу нельзя верить</strong>. Если данных мало, честный ответ — не считать.</div>'
      + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
  }
  return '<div class="screen__body">'
    + '<p class="lead-text">Какой метод подходит под каждый вопрос? «Разложение» — разложение показателя на множители, например выручка = клиенты × средний чек. «Не считать» — данных слишком мало для расчёта.</p>'
    + rows
    + '<div class="fb-hint mt-md">' + (state.checked ? 'Нажмите на вопрос, чтобы увидеть разбор.' : '') + '</div>'
    + '<div id="fbbox" class="fb-zone">' + zoneHtml() + '</div>'
    + '</div>' + bottom;
}

function render() {
  var body = state.screen === 'intro' ? renderIntro() : renderTask();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function choose(i, a) {
  if (state.checked) return;
  state.pick[i] = a;
  var box = document.getElementById('chips-' + i);
  for (var k = 0; k < box.children.length; k++) box.children[k].className = chipClass(i, k);
  document.getElementById('check-btn').disabled = !allPicked();
  notifyHeight();
}

function openRow(i) {
  if (!state.checked || i === state.open) return;
  var prev = state.open;
  state.open = i;
  document.getElementById('row-' + prev).className = rowClass(prev);
  document.getElementById('row-' + i).className = rowClass(i);
  document.getElementById('fbbox').innerHTML = nb(zoneHtml());
  notifyHeight();
}

function firstOpen() {
  for (var i = 0; i < ROWS.length; i++) if (grade(i) === 'bad') return i;
    return 0;
}

function start() { state.screen = 'task'; state.pick = []; state.checked = false; state.open = -1; render(); }
function check() { state.checked = true; state.open = firstOpen(); render(); }
function restart() { state.screen = 'intro'; state.pick = []; state.checked = false; state.open = -1; render(); }

render();
</script>
</body>
</html>
