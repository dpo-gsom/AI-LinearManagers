<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Какой приём поможет?</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ─── Экран: фиксированная высота, чтобы iframe не прыгал ─── */
  .screen { min-height: 705px; }
  .screen__body { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* ─── Ситуация ─── */
  .case-card { padding: 0 2px; }
  .case-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--dark); line-height: 1.25; margin-bottom: 6px; }
  .case-text { font-size: 14px; line-height: 1.6; color: var(--slate); }

  /* ─── Реплика в чате ─── */
  .bubble-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); margin-bottom: 4px; }
  .bubble { font-size: 14px; line-height: 1.6; padding: 12px 16px; }
  .bubble--user { background: var(--sand); border-radius: 16px 16px 4px 16px; color: var(--dark); margin-left: 8%; }
  .bubble--ai { background: var(--white); border: 1.5px solid var(--border); border-left: 4px solid var(--red); border-radius: 4px 16px 16px 16px; color: var(--slate); margin-right: 4%; }
  .bubble-wrap--user { text-align: right; }
  .bubble-wrap--user .bubble { text-align: left; }

  /* ─── Варианты ─── */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 12px 14px; font-size: 14px; line-height: 1.45; color: var(--dark); }
  .opt--locked { cursor: default; pointer-events: none; }

  /* ─── Зона разбора ─── */
  .fb-zone { min-height: 155px; }
  .fb-zone .hint {
    font-size: 13px;
    color: var(--slate);
    text-align: center;
    padding: 18px 10px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-md);
  }
  .why-line { margin-top: 7px; }
  .why-line .badge { margin-right: 6px; vertical-align: 1px; }

  /* ─── Шпаргалка на вводном экране ─── */
  .cheat { display: flex; flex-direction: column; gap: 6px; }
  .cheat .opt { cursor: default; }
  .cheat b { color: var(--dark); }
  .cheat span { color: var(--slate); font-size: 13px; }

  /* ─── Итог ─── */
  .sum-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sum-row:last-of-type { border-bottom: none; }
  .sum-row__name { flex: 1; color: var(--dark); line-height: 1.35; }
  .sum-row__name small { display: block; font-size: 12px; color: var(--slate); }
  .mark { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .mark--ok   { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
  .mark--warn { background: var(--amber-bg); border: 1.5px solid var(--amber); color: var(--amber); }
  .mark--bad  { background: var(--red-bg);   border: 1.5px solid var(--red);   color: var(--red);   }
  .sum-verdict { font-size: 14px; line-height: 1.65; color: var(--slate); }
  .sum-verdict b { color: var(--dark); }

  @media (max-width: 560px) {
    .screen { min-height: 820px; }
    .bubble--user { margin-left: 0; }
    .bubble--ai { margin-right: 0; }
    .fb-zone { min-height: 224px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   Какой приём поможет?
   Модуль 1 · страница «Приёмы, которые работают».
   Пять ситуаций — пять приёмов: показать пример, попросить задать вопросы,
   включить режим рассуждений, включить поиск, попросить составить промпт.
   ========================================================= */

var CFG = {
  title: 'Какой приём',
  titleSpan: 'поможет?',
  intro: 'Пять рабочих ситуаций. Для каждой выберите приём, который быстрее всего приведёт к хорошему результату.',
  introExtra: '<div class="cheat mt-sm">'
    + '<div class="card opt"><b>Показать пример</b><br><span>Приложить образец: прошлое письмо, удачный отчёт.</span></div>'
    + '<div class="card opt"><b>Попросить задать вопросы</b><br><span>«Прежде чем отвечать, задай мне пять уточняющих вопросов».</span></div>'
    + '<div class="card opt"><b>Попросить составить промпт</b><br><span>Описать задачу своими словами и попросить превратить её в промпт.</span></div>'
    + '<div class="card opt"><b>Включить режим рассуждений</b><br><span>Нейросеть сначала разбирает задачу по шагам, потом отвечает.</span></div>'
    + '<div class="card opt"><b>Включить поиск</b><br><span>Нейросеть ищет свежие материалы в интернете и даёт ссылки.</span></div>'
    + '</div>',
  progressLabel: 'Ситуация',
  question: 'Какой приём поможет здесь больше всего?',
  nextLabel: 'Следующая ситуация',
  finalTitle: 'Ваш выбор приёмов',
  allRight: 'Вы <b>уверенно подбираете приём</b> под задачу.',
  someWrong: 'Стоит ещё раз посмотреть на приёмы:',
  summary: 'Приёмы стоит выбирать по задаче: стиль — <strong>показать пример</strong>, размытая задача — <strong>попросить задать вопросы</strong>, повторяющаяся — <strong>попросить составить промпт</strong>, сложный анализ — <strong>режим рассуждений</strong>, свежие данные — <strong>поиск</strong>. Их можно сочетать: например, приложить пример и попросить задать вопросы.'
};

var CASES = [
  {
    title: 'Письмо в привычном стиле',
    text: 'Каждый месяц вы рассылаете партнёрам новости отдела. У писем сложился свой узнаваемый стиль, и партнёры к нему привыкли. А нейросеть пишет «как все».',
    right: 'показать пример',
    badge: 'Показать пример',
    options: [
      { t: 'Попросить составить промпт', level: 'warn',
        fb: 'Нейросеть поможет сформулировать промпт, но ваш стиль она всё равно не угадает. Быстрее показать прошлое письмо.' },
      { t: 'Показать пример', level: 'ok',
        fb: 'Приложите одно-два прошлых письма и попросите написать новое в том же стиле. Объяснять стиль словами долго и неточно, а образец нейросеть повторяет хорошо.' },
      { t: 'Включить поиск', level: 'bad',
        fb: 'В интернете ваших писем нет. Нужен образец — приложите прошлое письмо.' }
    ]
  },
  {
    title: 'Размытая задача',
    text: 'Директор попросил «подумать, как улучшить адаптацию новичков». Вы сами пока не понимаете, с чего начать и что должно получиться в итоге.',
    right: 'попросить задать вопросы',
    badge: 'Попросить задать вопросы',
    options: [
      { t: 'Включить режим рассуждений', level: 'warn',
        fb: 'Рассуждения помогут с анализом, но сначала нужно понять саму задачу. Попросите нейросеть задать вам вопросы: отвечая, вы разберётесь, что нужно.' },
      { t: 'Показать пример', level: 'bad',
        fb: 'Примера нет: вы ещё не знаете, каким должен быть результат. Сначала разберитесь с задачей — попросите нейросеть задать вам вопросы.' },
      { t: 'Попросить задать вопросы', level: 'ok',
        fb: 'Напишите: «Прежде чем отвечать, задай мне пять уточняющих вопросов». Отвечая, вы сами поймёте, чего хотите, а нейросеть получит контекст.' }
    ]
  },
  {
    title: 'Выбор подрядчика',
    text: 'Три подрядчика прислали коммерческие предложения: разные цены, сроки, условия оплаты и гарантии. Нужно сравнить их и понять, где риски.',
    right: 'режим рассуждений',
    badge: 'Режим рассуждений',
    options: [
      { t: 'Включить режим рассуждений', level: 'ok',
        fb: 'В этом режиме нейросеть сначала разбирает задачу по шагам и только потом отвечает. Когда нужно сравнить много условий, результат заметно точнее. Перед отправкой уберите из предложений конфиденциальные данные.' },
      { t: 'Включить поиск', level: 'warn',
        fb: 'Поиск пригодится, если нужно проверить репутацию подрядчиков. Но главное здесь — аккуратно сравнить много условий, и для этого нужен режим рассуждений.' },
      { t: 'Показать пример', level: 'bad',
        fb: 'Пример чужого сравнения не поможет взвесить ваши условия. Нужен анализ — включите режим рассуждений.' }
    ]
  },
  {
    title: 'Изменения в законе',
    text: 'Нужно коротко рассказать команде, что изменилось в законодательстве о персональных данных за последний год.',
    right: 'включить поиск',
    badge: 'Поиск',
    options: [
      { t: 'Попросить задать вопросы', level: 'bad',
        fb: 'Уточнения не помогут: дело не в задаче, а в том, что нейросеть не знает свежих новостей. Нужен поиск.' },
      { t: 'Включить поиск', level: 'ok',
        fb: 'Нейросеть знает мир только до даты обучения. С поиском она найдёт свежие материалы и даст ссылки — откройте их и проверьте.' },
      { t: 'Включить режим рассуждений', level: 'bad',
        fb: 'Рассуждения не добавят свежих знаний: без поиска нейросеть не знает, что изменилось после её обучения.' }
    ]
  },
  {
    title: 'Еженедельный отчёт',
    text: 'Каждую пятницу вы готовите для руководителя короткий отчёт по отделу. Хочется один раз сделать хороший промпт и пользоваться им дальше.',
    right: 'попросить составить промпт',
    badge: 'Попросить составить промпт',
    options: [
      { t: 'Показать пример', level: 'warn',
        fb: 'Прошлый отчёт пригодится — его стоит вложить в шаблон. Но сам шаблон быстрее получить, попросив нейросеть составить промпт.' },
      { t: 'Попросить задать вопросы', level: 'warn',
        fb: 'Это поможет с отчётом на этой неделе, но в следующую пятницу всё придётся повторять. Лучше один раз попросить нейросеть составить промпт и сохранить его.' },
      { t: 'Попросить составить промпт', level: 'ok',
        fb: 'Опишите задачу своими словами и попросите: «Составь промпт, который я смогу использовать каждую неделю, подставляя свежие данные». Сохраните его как шаблон.' }
    ]
  }
];

/* level: ok — верно, warn — допустимо, но не лучший вариант, bad — неверно */
var state = { screen: 'intro', i: 0, answers: [] };

/* ─── Типографика: неразрывные пробелы ─────────────────── */

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2 ');
  return s.replace(/ — /g, ' — ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1 ');
}

/* ─── Варианты ──────────────────────────────────────────── */

function rightIdx(c) {
  for (var k = 0; k < c.options.length; k++) if (c.options[k].level === 'ok') return k;
}

function lockedClass(idx, ans) {
  var c = CASES[state.i];
  var cls = 'card opt opt--locked';
  if (idx === rightIdx(c)) return cls + ' card--correct';
  if (idx === ans) return cls + (c.options[idx].level === 'warn' ? ' card--warning' : ' card--wrong');
  return cls + ' card--dimmed';
}

function optionsHtml() {
  var c = CASES[state.i];
  var ans = state.answers[state.i];
  var h = '<div class="options">';
  for (var k = 0; k < c.options.length; k++) {
    if (ans === undefined) h += '<div class="card card--interactive opt" data-opt="' + k + '" onclick="pick(' + k + ')">' + c.options[k].t + '</div>';
    else h += '<div class="' + lockedClass(k, ans) + '" data-opt="' + k + '">' + c.options[k].t + '</div>';
  }
  return h + '</div>';
}

/* ─── Разбор ────────────────────────────────────────────── */

var FB_CLASS = { ok: 'feedback--success', warn: 'feedback--warning', bad: 'feedback--error' };

function feedbackHtml(ans) {
  if (ans === undefined) return '<div class="hint">Выберите ответ — здесь появится разбор.</div>';
  var c = CASES[state.i];
  var o = c.options[ans];
  var head = o.level === 'ok' ? 'Верно · ' + c.right : (o.level === 'warn' ? 'Допустимо, но не лучший вариант' : 'Неверно · ' + c.right);
  var why = c.why ? '<div class="why-line"><span class="badge badge--neutral">' + c.badge + '</span>' + c.why + '</div>' : '';
  return nb('<div class="feedback ' + FB_CLASS[o.level] + '">'
    + '<div class="feedback__head">' + head + '</div>'
    + '<div>' + o.fb + '</div>' + why
    + '</div>');
}

function progressHtml() {
  return '<div class="progress">'
    + '<div class="progress__meta">'
    +   '<span class="progress__label">' + CFG.progressLabel + '</span>'
    +   '<span class="progress__fraction"><em>' + (state.i + 1) + '</em> / ' + CASES.length + '</span>'
    + '</div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (state.i / CASES.length * 100) + '%"></div></div>'
    + '</div>';
}

/* ─── Экраны ────────────────────────────────────────────── */

function renderIntro() {
  return '<div class="screen__body">'
    +   '<h1 class="page-title">' + CFG.title + '<span>' + CFG.titleSpan + '</span></h1>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">' + CFG.intro + '</p>'
    +   (CFG.introExtra || '')
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function bubbleHtml(c) {
  if (!c.bubble) return '';
  var user = c.bubble.who === 'user';
  return '<div class="mt-sm bubble-wrap--' + (user ? 'user' : 'ai') + '">'
    + '<div class="bubble-label">' + (user ? 'Промпт' : 'Ответ нейросети') + '</div>'
    + '<div class="bubble bubble--' + (user ? 'user' : 'ai') + '">' + c.bubble.text + '</div>'
    + '</div>';
}

function renderQuestion() {
  var c = CASES[state.i];
  var ans = state.answers[state.i];
  return '<div class="screen__body">'
    +   progressHtml()
    +   '<div class="case-card mt-sm">'
    +     '<div class="case-title">' + c.title + '</div>'
    +     (c.text ? '<p class="case-text">' + c.text + '</p>' : '')
    +   '</div>'
    +   bubbleHtml(c)
    +   '<div class="question-text mt-md">' + (c.question || CFG.question) + '</div>'
    +   '<div id="optbox" class="mt-sm">' + optionsHtml() + '</div>'
    +   '<div id="fbbox" class="fb-zone mt-sm">' + feedbackHtml(ans) + '</div>'
    + '</div>'
    + '<div class="nav-bar">'
    +   '<button id="next-btn" class="btn btn--primary btn--full" onclick="next()"' + (ans === undefined ? ' disabled' : '') + '>'
    +     (state.i === CASES.length - 1 ? 'К итогам →' : CFG.nextLabel + ' →')
    +   '</button>'
    + '</div>';
}

var MARK = { ok: '✓', warn: '~', bad: '✕' };

function renderFinal() {
  var rows = '', misses = [];
  for (var n = 0; n < CASES.length; n++) {
    var c = CASES[n];
    var lv = c.options[state.answers[n]].level;
    if (lv !== 'ok') misses.push(c.badge || c.title);
    rows += '<div class="sum-row">'
      + '<div class="sum-row__name">' + c.title + '<small>' + c.right.charAt(0).toUpperCase() + c.right.slice(1) + '</small></div>'
      + '<span class="mark mark--' + lv + '">' + MARK[lv] + '</span>'
      + '</div>';
  }
  var verdict = misses.length === 0 ? CFG.allRight : CFG.someWrong + ' <b>' + misses.join(', ').toLowerCase() + '</b>.';
  return '<div class="screen__body">'
    +   '<h2 class="section-title">' + CFG.finalTitle + '</h2>'
    +   '<div class="divider"></div>'
    +   rows
    +   '<p class="sum-verdict mt-sm">' + verdict + '</p>'
    +   '<div class="legend-box">'
    +     '<span class="legend-tag">Итог</span>'
    +     CFG.summary
    +   '</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
}

/* ─── Управление ────────────────────────────────────────── */

function render() {
  var body;
  if (state.screen === 'intro') body = renderIntro();
  else if (state.screen === 'q') body = renderQuestion();
  else body = renderFinal();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function start() {
  state.screen = 'q';
  state.i = 0;
  state.answers = [];
  render();
}

/* Выбор обновляет варианты и разбор на месте: экран не вздрагивает */
function pick(idx) {
  if (state.answers[state.i] !== undefined) return;
  state.answers[state.i] = idx;
  var opts = document.querySelectorAll('#optbox [data-opt]');
  for (var k = 0; k < opts.length; k++) {
    opts[k].className = lockedClass(k, idx);
    opts[k].onclick = null;
  }
  document.getElementById('fbbox').innerHTML = feedbackHtml(idx);
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function next() {
  if (state.i === CASES.length - 1) state.screen = 'final';
  else state.i++;
  render();
}

function restart() {
  state.screen = 'intro';
  state.i = 0;
  state.answers = [];
  render();
}

render();
</script>
</body>
</html>
