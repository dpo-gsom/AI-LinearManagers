<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что уйдёт в нейросеть?</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 1157px; display: flex; flex-direction: column; }
  .screen__body { display: flex; flex-direction: column; }

  .row { margin-top: 8px; padding: 8px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); }
  .row__head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row__name { font-size: 14px; font-weight: 600; color: var(--dark); }
  .row__sample { font-size: 12px; color: var(--slate); opacity: .8; margin-top: 2px; }
  .row__main { min-width: 0; }
  @media (min-width: 561px) {
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .row .chips { margin-top: 0; justify-content: flex-end; }
  }
  .why-tag { font-size: 12px; font-weight: 600; color: var(--dark); white-space: nowrap; }
  .row--click { cursor: pointer; }
  .row--click:hover { background: var(--sand); }
  .row--open { box-shadow: 0 0 0 2px var(--dark); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 5px 10px; font-size: 12.5px; line-height: 1.3; color: var(--dark); border-radius: 18px; }
  .chip.card--selected { border-color: var(--red); background: var(--red-bg); }
  .chip--locked { cursor: inherit; pointer-events: none; }

  .fb-hint { font-size: 13px; color: var(--slate); margin-bottom: 6px; min-height: 20px; }
  .fb-zone { min-height: 130px; }
  .fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }
  .verdict { font-size: 14px; line-height: 1.6; color: var(--slate); margin-bottom: 8px; }
  .verdict b { color: var(--dark); }
  @media (max-width: 560px) { .screen { min-height: 1817px; } .fb-zone { min-height: 190px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* =========================================================
   Что уйдёт в нейросеть?
   Модуль 3 · страница «Подготовить данные».
   Классификация: столбец выгрузки → что с ним сделать перед загрузкой.
   Зелёный — лучший вариант, жёлтый — допустимо, красный — неверно.
   ========================================================= */

var ACTS = ['Оставить', 'Псевдоним', 'Пересчитать', 'Удалить'];

var ROWS = [
  { name: 'ФИО менеджера', sample: 'Соколова Анна Викторовна', right: 1, warn: -1,
    fb: [
      'Имя — персональные данные, во внешний сервис его не отправляют.',
      'Менеджеров нужно различать, но имена нейросети не нужны. Пишите «Менеджер 1», «Менеджер 2», а таблицу соответствия храните у себя.',
      'Имя нельзя пересчитать. Его заменяют псевдонимом: «Менеджер 1».',
      'Без этого столбца не понять, у кого упали продажи. Замените имена кодами.'
    ] },
  { name: 'Клиент', sample: 'ООО «…», ИНН 7804…', right: 3, warn: 1,
    fb: [
      'Название и ИНН клиента — коммерческая тайна. А для вопроса о продажах менеджеров клиент не нужен.',
      'Допустимо: коды пригодятся, если нужно видеть повторные покупки. Но для вопроса «у кого упали продажи» клиент не нужен, проще удалить.',
      'Название нельзя пересчитать. Для этого вопроса клиент не нужен, удалите столбец.',
      'Для вопроса о продажах менеджеров клиент не нужен. Чем меньше лишнего в файле, тем меньше риск.'
    ] },
  { name: 'Телефон клиента', sample: '+7 921 …', right: 3, warn: -1,
    fb: [
      'Телефон — персональные данные, а для анализа он не нужен.',
      'Код вместо телефона ничего не даст анализу. Столбец просто не нужен.',
      'Телефон нельзя пересчитать, и для анализа он не нужен.',
      'Для анализа телефон не нужен, а риск утечки есть.'
    ] },
  { name: 'Сумма сделки, руб.', sample: '1 240 000', right: 2, warn: -1,
    fb: [
      'Реальные суммы — коммерческая тайна. Их пересчитывают: доли и сравнения при этом сохраняются.',
      'По суммам считают продажи, код их не заменит. Умножьте на коэффициент или переведите в доли.',
      'Умножьте суммы на коэффициент, например на 0,73, и запишите его у себя. Доли и сравнения не изменятся, а цифры из ответа вы переведёте обратно.',
      'Без сумм не понять, у кого упали продажи. Пересчитайте их на коэффициент.'
    ] },
  { name: 'Регион', sample: 'Северо-Запад', right: 0, warn: 1,
    fb: [
      'Регион ничего не раскрывает и может объяснить спад. Оставьте.',
      'Допустимо, но незачем: регион ничего не раскрывает, а «Регион 3» труднее читать в ответе.',
      'Регион нельзя пересчитать. Он ничего не раскрывает, оставьте как есть.',
      'Спад может быть связан с регионом. Столбец ничего не раскрывает, оставьте его.'
    ] },
  { name: 'Дата сделки', sample: '14.10.2026', right: 0, warn: -1,
    fb: [
      'По датам видно, когда начался спад. Сами по себе они ничего не раскрывают.',
      'Код вместо даты сломает анализ: станет непонятно, когда начался спад.',
      'Даты не пересчитывают. Они нужны, чтобы увидеть, когда начался спад.',
      'Без дат не увидеть, когда начался спад. Оставьте столбец.'
    ] },
  { name: 'Комментарий менеджера', sample: '«Иван Петрович просил скидку, перезвонить после 15-го»', right: 3, warn: -1,
    fb: [
      'В свободных комментариях чаще всего оказываются имена, телефоны и личные подробности. Для вопроса о продажах они не нужны.',
      'Текст псевдонимом не заменить. Если причины из комментариев действительно нужны, их сначала вычищают отдельно. Для этого вопроса столбец не нужен.',
      'Текст нельзя пересчитать. В комментариях имена и личные подробности — удалите столбец.',
      'Самый рискованный столбец: в комментариях имена, телефоны и личные подробности. Для вопроса о продажах он не нужен.'
    ] },
  { name: 'Скрытый лист «Премии»', sample: 'зарплаты и премии менеджеров', right: 3, warn: -1,
    fb: [
      'Скрытый лист уходит вместе с файлом, и нейросеть его прочитает. Зарплаты — конфиденциальные данные.',
      'Коды не спасут: зарплаты конфиденциальны, а для вопроса они не нужны. Удалите лист.',
      'Для вопроса о продажах премии не нужны. Удалите лист целиком.',
      'Скрытые листы, столбцы и примечания уходят вместе с файлом. Найти их помогает «Файл → Сведения → Поиск проблем → Инспектор документов».'
    ] }
];

var state = { screen: 'intro', pick: [], checked: false, open: -1 };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2&nbsp;');
  return s.replace(/ — /g, '&nbsp;— ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1&nbsp;');
}

function grade(i) {
  var p = state.pick[i];
  return p === ROWS[i].right ? 'ok' : (p === ROWS[i].warn ? 'warn' : 'bad');
}
function allPicked() { for (var i = 0; i < ROWS.length; i++) if (state.pick[i] === undefined) return false; return true; }

function chipClass(i, a) {
  var p = state.pick[i];
  if (!state.checked) return 'card card--interactive chip' + (p === a ? ' card--selected' : '');
  if (a === ROWS[i].right) return 'card chip chip--locked card--correct';
  if (a === p) return 'card chip chip--locked ' + (a === ROWS[i].warn ? 'card--warning' : 'card--wrong');
  return 'card chip chip--locked card--dimmed';
}
function rowClass(i) {
  if (!state.checked) return 'row';
  return 'row row--click' + (i === state.open ? ' row--open' : '');
}

function rowHtml(i) {
  var r = ROWS[i], chips = '';
  for (var a = 0; a < ACTS.length; a++)
    chips += '<div class="' + chipClass(i, a) + '" onclick="choose(' + i + ',' + a + ')">' + ACTS[a] + '</div>';
  return '<div id="row-' + i + '" class="' + rowClass(i) + '" onclick="openRow(' + i + ')">'
    + '<div class="row__main"><div class="row__head"><span class="row__name">' + r.name + '</span>'
    + (state.checked ? '<span class="why-tag">Почему? ›</span>' : '') + '</div>'
    + '<div class="row__sample">' + r.sample + '</div></div>'
    + '<div class="chips" id="chips-' + i + '">' + chips + '</div></div>';
}

function verdictHtml() {
  var bad = 0, warn = 0;
  for (var j = 0; j < ROWS.length; j++) { var g = grade(j); if (g === 'bad') bad++; if (g === 'warn') warn++; }
  if (bad === 0 && warn === 0) return 'Вы <b>уверенно отделяете нужное от лишнего</b>: в файле останется только то, что работает на вопрос.';
  if (bad === 0) return 'Ничего опасного не уйдёт. Жёлтым отмечены решения, которые можно упростить.';
  return 'Посмотрите столбцы, отмеченные красным: что-то из них <b>уйдёт в сервис лишним</b> или пропадёт нужное для анализа.';
}

function zoneHtml() {
  if (!state.checked) return '<div class="hint">После проверки здесь появится разбор.</div>';
  var i = state.open, r = ROWS[i], g = grade(i);
  var cls = g === 'ok' ? 'feedback--success' : (g === 'warn' ? 'feedback--warning' : 'feedback--error');
  var head = g === 'ok' ? 'Верно' : (g === 'warn' ? 'Допустимо, но…' : 'Неверно');
  return '<p class="verdict">' + verdictHtml() + '</p>'
    + '<div class="feedback ' + cls + '">'
    + '<div class="feedback__head">' + head + ' · ' + r.name + ' — ' + ACTS[r.right].toLowerCase() + '</div>'
    + r.fb[state.pick[i]] + '</div>';
}

function renderIntro() {
  return '<div class="screen__body">'
    + '<h1 class="page-title">Что уйдёт <span>в нейросеть?</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Руководитель отдела продаж хочет спросить нейросеть, почему в октябре у части менеджеров упали продажи. У него есть выгрузка из CRM-системы. Перед загрузкой нужно решить, что сделать с каждым столбцом: оставить, заменить псевдонимом, пересчитать или удалить.</p>'
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderTask() {
  var rows = '';
  for (var i = 0; i < ROWS.length; i++) rows += rowHtml(i);
  var bottom;
  if (!state.checked) {
    bottom = '<button id="check-btn" class="btn btn--primary btn--full mt-md" onclick="check()"' + (allPicked() ? '' : ' disabled') + '>Проверить →</button>';
  } else {
    bottom = '<div class="legend-box"><span class="legend-tag">Итог</span>'
      + 'Про каждый столбец задайте два вопроса: <strong>нужен ли он для моего вопроса</strong> и <strong>что он раскрывает</strong>. Не нужен — удалить. Нужен и раскрывает — заменить псевдонимом или пересчитать.</div>'
      + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
  }
  return '<div class="screen__body">'
    + '<p class="lead-text">Вопрос к нейросети: «Почему в октябре у части менеджеров упали продажи?» Что сделать с каждым столбцом?</p>'
    + rows
    + '<div class="fb-hint mt-md">' + (state.checked ? 'Нажмите на столбец, чтобы увидеть разбор.' : '') + '</div>'
    + '<div id="fbbox" class="fb-zone">' + zoneHtml() + '</div>'
    + '</div>' + bottom;
}

function render() {
  var body = state.screen === 'intro' ? renderIntro() : renderTask();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function choose(i, a) {
  if (state.checked) return;
  state.pick[i] = a;
  var box = document.getElementById('chips-' + i);
  for (var k = 0; k < box.children.length; k++) box.children[k].className = chipClass(i, k);
  document.getElementById('check-btn').disabled = !allPicked();
  notifyHeight();
}

function openRow(i) {
  if (!state.checked || i === state.open) return;
  var prev = state.open;
  state.open = i;
  document.getElementById('row-' + prev).className = rowClass(prev);
  document.getElementById('row-' + i).className = rowClass(i);
  document.getElementById('fbbox').innerHTML = nb(zoneHtml());
  notifyHeight();
}

function firstOpen() {
  for (var i = 0; i < ROWS.length; i++) if (grade(i) === 'bad') return i;
  for (i = 0; i < ROWS.length; i++) if (grade(i) === 'warn') return i;
  return 0;
}

function start() { state.screen = 'task'; state.pick = []; state.checked = false; state.open = -1; render(); }
function check() { state.checked = true; state.open = firstOpen(); render(); }
function restart() { state.screen = 'intro'; state.pick = []; state.checked = false; state.open = -1; render(); }

render();
</script>
</body>
</html>
