<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор промптов</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 768px; display: flex; flex-direction: column; }
    .step-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); margin: 16px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 8px 12px; font-size: 13px; line-height: 1.3; color: var(--dark); border-radius: 18px; }
  .chip.card--selected { border-color: var(--red); background: var(--red-bg); }
  .m-desc { font-size: 13px; line-height: 1.55; color: var(--slate); margin-top: 10px; }
  .prompt { background: var(--sand); border-radius: 16px 16px 4px 16px; padding: 14px 16px; font-size: 14px; line-height: 1.6; color: var(--dark); white-space: pre-wrap; margin-top: 8px; }
  .prompt mark { background: #FFE8A3; color: var(--dark); border-radius: 3px; padding: 0 2px; }
  .copy-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .copy-note { font-size: 12px; color: var(--slate); }
  @media (max-width: 560px) { .screen { min-height: 977px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* Модуль 2 · последняя страница. Выбрать задачу и приём — получить
   промпт-заготовку. В квадратных скобках то, что подставляет слушатель. */

var LIB = [
  { task: 'Выжимка документа', methods: [
    { name: 'Под задачу', desc: 'Главный приём: нейросеть выбирает главное с учётом того, для чего вам выжимка.',
      p: 'Я [должность]. Прочитай приложенный документ: [что это за документ].\nМне нужно [что вы будете делать с выжимкой: решить, объяснить команде, ответить директору].\nВыпиши только то, что важно для этой задачи: [что именно: что меняется, сроки, суммы, обязанности].\nК каждому пункту укажи раздел или страницу документа. Если чего-то в документе нет, так и напиши.' },
    { name: 'Перевёрнутая пирамида', desc: 'Принцип из журналистики: читатель получает суть в первой строке, детали — ниже по убыванию важности.',
      p: 'Сделай выжимку приложенного документа для [кого].\nПервая строка — одно предложение: что из документа важнее всего для читателя.\nДалее — 3–5 пунктов по убыванию важности.\nОбъём — не больше [N] слов. Опирайся только на текст документа.' }
  ]},
  { task: 'Итоги встречи', methods: [
    { name: 'Решение — ответственный — срок', desc: 'Протокол, по которому можно работать: что решили, кто делает и к какому сроку.',
      p: 'Вот заметки (расшифровка) встречи [тема, дата]: [текст].\nСделай протокол для участников и тех, кого не было.\nФормат — таблица: решение | ответственный | срок.\nЕсли ответственный или срок не названы, пиши «не назначен», ничего не придумывай.\nОтдельно — вопросы, которые остались открытыми.' }
  ]},
  { task: 'Идеи и варианты', methods: [
    { name: 'Много, потом отбор', desc: 'Главное правило штурма: сначала количество без оценки, потом отбор по вашим критериям.',
      p: 'Задача: [что нужно решить]. Контекст: [команда, ограничения, что уже пробовали].\nДай 15 идей. Не оценивай их и не повторяй очевидное: [что исключить].\nПотом, в следующем сообщении, я попрошу отобрать.' },
    { name: 'Отбор по критериям', desc: 'Второй шаг штурма: сравнить идеи по критериям, которые важны именно вам.',
      p: 'Оцени идеи из списка по критериям: [стоимость, срок запуска, что нужно от меня, риск].\nСведи в таблицу. Выбери три лучшие и объясни выбор в одном предложении для каждой.\nРешение приму я — не называй идею единственно верной.' },
    { name: 'Инверсия', desc: 'Приём латерального мышления Эдварда де Боно: придумать, как гарантированно провалить задачу, а потом перевернуть каждый способ в решение.',
      p: 'Примени метод «инверсии» из латерального мышления к задаче: [ваша задача].\nСначала придумай 5 абсурдных способов гарантированно провалить задачу и сделать максимально плохо.\nЗатем переверни каждый способ в нестандартное и практичное решение.' },
    { name: 'SCAMPER', desc: 'Семь вопросов к тому, что уже есть: заменить, объединить, адаптировать, изменить, применить иначе, убрать, сделать наоборот.',
      p: 'У нас есть [процесс или решение, которое хотим улучшить].\nПройди по семи вопросам SCAMPER: что заменить, что объединить, что взять из другой сферы, что увеличить или уменьшить, как использовать иначе, что убрать, что сделать в обратном порядке.\nНа каждый вопрос — одна конкретная идея для нашей ситуации: [контекст].' },
    { name: 'CRAFT: роли и формат', desc: 'Методология ИКРЫ: посмотреть на ситуацию как на набор ролей и отношений между людьми и перенести в неё формат из другой ситуации.',
      p: 'Ситуация: [например, еженедельная планёрка отдела]. Опиши, какие в ней роли и как они взаимодействуют.\nТеперь перенеси в неё формат из другой ситуации: [эстафета, радиоэфир, разбор полётов, кулинарный мастер-класс].\nКак изменятся роли и отношения? Предложи 3 варианта новой [планёрки] с описанием, что в ней происходит.' }
  ]},
  { task: 'Проверить идею', methods: [
    { name: 'Премортем', desc: 'Приём психолога Гэри Кляйна: представить, что проект уже провалился, и назвать причины.',
      p: 'Идея: [описание]. Представь, что прошло [три месяца] и идея провалилась.\nНазови 5 самых вероятных причин провала для нашей ситуации: [контекст].\nДля каждой — что сделать заранее, чтобы её предотвратить.' },
    { name: 'Шесть шляп', desc: 'Метод Эдварда де Боно: рассмотреть идею по очереди с шести сторон, не смешивая их.',
      p: 'Разбери идею «[описание]» методом шести шляп де Боно:\nбелая — какие факты есть и каких не хватает;\nкрасная — какие эмоции вызовет у команды;\nчёрная — риски;\nжёлтая — выгоды;\nзелёная — как улучшить;\nсиняя — итог и следующий шаг.\nПо 2–3 пункта на шляпу. Контекст: [команда, ограничения].' }
  ]},
  { task: 'Служебка и отчёт', methods: [
    { name: 'Главное в начале', desc: 'Вывод или просьба — в первом абзаце. Руководитель может дочитать, а может и нет.',
      p: 'Напиши служебную записку [кому] от [должность].\nПервый абзац — просьба и что нужно от адресата: [что согласовать, к какому сроку].\nДалее — обоснование только по этим данным: [факты, цифры].\nНичего не добавляй от себя: ни оценок, ни прогнозов, которых нет в данных. До [N] слов.' },
    { name: 'Пирамида Минто', desc: 'Принцип Барбары Минто: сначала вывод, под ним 2–3 аргумента, под каждым — факты.',
      p: 'Построй [отчёт / записку] по принципу пирамиды Минто:\nвверху — главный вывод одним предложением;\nпод ним — три аргумента;\nпод каждым аргументом — факты только из моих данных: [данные].\nЕсли для аргумента не хватает фактов, отметь это.' },
    { name: 'Регулярный отчёт', desc: 'Постоянная структура для еженедельного отчёта или статуса: сохраните промпт и вставляйте свежие заметки.',
      p: 'Вот мои заметки за неделю: [заметки].\nСделай отчёт для [кого] по структуре: сделано — в работе — риски — нужна помощь.\nВ блоке «нужна помощь» — что конкретно нужно от адресата и к какому сроку.\nТолько по моим заметкам, до [N] слов.' },
    { name: 'Глазами адресата', desc: 'Проверка перед отправкой: какие вопросы задаст тот, кто будет читать.',
      p: 'Ты [финансовый / генеральный] директор, тебе пришла эта записка: [текст].\nКакие три вопроса ты задашь автору? Что в тексте неубедительно? Чего не хватает для решения?' }
  ]},
  { task: 'Поручение сотруднику', methods: [
    { name: 'По SMART', desc: 'Цель поручения — конкретная, измеримая, достижимая, значимая и с указанным сроком.',
      p: 'Вот моя заметка о задаче: [сумбурно, как есть].\nПреврати её в поручение для [сотрудник, его опыт].\nПроверь по SMART: конкретно ли, как измерить результат, реально ли, зачем это нужно, какой срок.\nЕсли каких-то данных не хватает, не придумывай — задай мне вопросы.' },
    { name: 'Критерии готовности', desc: 'Описать, что вы получите на выходе и как поймёте, что задача выполнена.',
      p: 'Добавь в поручение [текст] блок «Результат»: в каком виде сдать, какой объём и три признака, по которым я пойму, что задача выполнена.' },
    { name: 'Вопросы сотрудника', desc: 'Нейросеть играет сотрудника и задаёт вопросы, которые он принёс бы вам.',
      p: 'Представь, что ты [должность сотрудника] и получил от меня это поручение: [текст].\nКакие пять вопросов ты мне задашь, прежде чем начать работу?' }
  ]},
  { task: 'Трудное сообщение', methods: [
    { name: 'Эмоциональный фильтр', desc: 'Пишете сгоряча, как есть. Нейросеть убирает эмоции и сохраняет суть.',
      p: 'Вот мой черновик, написанный сгоряча: [текст].\nУбери эмоции, оценки и сарказм. Сохрани факты: [главное] и мою просьбу: [что нужно от адресата].\nТон спокойный и деловой. Не извиняйся за то, в чём нет моей вины.' },
    { name: 'SBI', desc: 'Обратная связь по модели Центра креативного лидерства: ситуация, поведение, влияние — без оценки личности.',
      p: 'Помоги подготовить обратную связь сотруднику [роль, без имени].\nСитуация: [когда и где].\nПоведение: [что он сделал — только наблюдаемые действия].\nВлияние: [к чему это привело].\nПо модели SBI напиши 4–5 предложений. Без оценок личности, в конце — вопрос к сотруднику.' },
    { name: 'Ненасильственное общение', desc: 'Модель Маршалла Розенберга: наблюдение — чувство — потребность — просьба.',
      p: 'Переформулируй моё сообщение [текст] по модели ненасильственного общения Розенберга:\nнаблюдение без оценки, моё чувство, моя потребность, конкретная просьба.\nЗвучать должно естественно, как деловая речь, без психологических терминов.' },
    { name: 'Репетиция разговора', desc: 'Нейросеть играет собеседника, а вы тренируете трудный разговор до того, как он случится.',
      p: 'Мне предстоит разговор: [с кем, о чём]. Сыграй [собеседника]: он [защищается / спорит / обижается].\nОтвечай коротко, как в жизни, по одной реплике.\nПосле каждой моей реплики отдельной строкой дай совет, что можно сказать лучше.\nНачни с первой реплики собеседника.' }
  ]},
  { task: 'Тон и адресат', methods: [
    { name: 'Информационный стиль', desc: 'Приёмы из книги «Пиши, сокращай» Максима Ильяхова и Людмилы Сарычевой: убрать лишнее, заменить оценки фактами.',
      p: 'Отредактируй текст: [текст].\nУбери канцелярит, штампы и пустые слова («является», «осуществлять», «в рамках», «данный»).\nЗамени оценки фактами: вместо «значительно выросло» — цифра, если она есть в тексте.\nНе добавляй ничего нового. Покажи, что убрал.' },
    { name: 'Под адресата', desc: 'Один смысл — разное содержание: директору деньги и риски, команде действия, клиенту выгода.',
      p: 'Вот сообщение: [текст].\nПерепиши его для [директора / команды / клиента / новичка].\nЭтому читателю важно: [что ему нужно знать или сделать].\nУбери то, что ему не нужно. До [N] слов.' },
    { name: 'Образец стиля', desc: 'Чтобы текст звучал как вы: покажите нейросети два-три своих письма без имён и внутренних данных.',
      p: 'Вот три моих письма команде: [тексты].\nНапиши [объявление / письмо] о [тема] в том же стиле: та же длина фраз, то же обращение, тот же тон.' },
    { name: 'Как новичку', desc: 'Для инструкций и регламентов: объяснить так, чтобы понял человек в первый рабочий день.',
      p: 'Перепиши [регламент / инструкцию] так, чтобы понял сотрудник в первый рабочий день.\nБез внутренних сокращений и терминов, а если без термина никак — поясни его.\nФормат: нумерованные шаги, в конце — к кому обращаться с вопросами.' }
  ]}
];

var state = { t: 0, m: 0, copied: false };

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function marked(s) { return esc(s).replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>'); }

function tasksHtml() {
  var s = '';
  for (var i = 0; i < LIB.length; i++)
    s += '<div class="card card--interactive chip' + (i === state.t ? ' card--selected' : '') + '" onclick="setT(' + i + ')">' + LIB[i].task + '</div>';
  return s;
}

function methodsHtml() {
  var s = '', ms = LIB[state.t].methods;
  for (var j = 0; j < ms.length; j++)
    s += '<div class="card card--interactive chip' + (j === state.m ? ' card--selected' : '') + '" onclick="setM(' + j + ')">' + ms[j].name + '</div>';
  return s;
}

function noteText() {
  return state.copied ? 'Скопировано. Вставьте в чат нейросети и заполните скобки.' : 'Не вставляйте в промпт персональные данные и коммерческую тайну.';
}

/* Экран рисуется один раз; клики обновляют блоки на месте */
function render() {
  var m = LIB[state.t].methods[state.m];
  var h = '<h1 class="page-title">Генератор <span>промптов</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Выберите задачу и приём. Скопируйте заготовку и замените то, что в квадратных скобках, своими данными.</p>'
    + '<div class="step-label">1. Задача</div><div class="chips" id="tasks">' + tasksHtml() + '</div>'
    + '<div class="step-label">2. Приём</div><div class="chips" id="methods">' + methodsHtml() + '</div>'
    + '<p class="m-desc" id="m-desc">' + m.desc + '</p>'
    + '<div class="step-label">3. Промпт</div>'
    + '<div class="prompt" id="prompt">' + marked(m.p) + '</div>'
    + '<div class="copy-row"><button class="btn btn--primary" onclick="copy()">Скопировать</button>'
    + '<span class="copy-note" id="copy-note">' + noteText() + '</span></div>';
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen">' + h + '</div>';
  notifyHeight();
}

function update() {
  var m = LIB[state.t].methods[state.m];
  document.getElementById('tasks').innerHTML = tasksHtml();
  document.getElementById('methods').innerHTML = methodsHtml();
  document.getElementById('m-desc').innerHTML = m.desc;
  document.getElementById('prompt').innerHTML = marked(m.p);
  document.getElementById('copy-note').textContent = noteText();
  notifyHeight();
}

function setT(i) { state.t = i; state.m = 0; state.copied = false; update(); }
function setM(j) { state.m = j; state.copied = false; update(); }

function copy() {
  var text = LIB[state.t].methods[state.m].p;
  function done() { state.copied = true; document.getElementById('copy-note').textContent = noteText(); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  }
}

render();
</script>
</body>
</html>
