<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сколько доверить помощнику</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 1000px; display: flex; flex-direction: column; }
  .screen__body { display: flex; flex-direction: column; }

  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; background: var(--sand); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; line-height: 1.45; color: var(--slate); margin-top: 8px; }
  .levels b { color: var(--dark); }
  .row { margin-top: 8px; padding: 8px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); }
  .row__head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row__name { font-size: 14px; font-weight: 600; color: var(--dark); line-height: 1.45; }
  .why-tag { font-size: 12px; font-weight: 600; color: var(--dark); white-space: nowrap; }
  .row--click { cursor: pointer; }
  .row--click:hover { background: var(--sand); }
  .row--open { box-shadow: 0 0 0 2px var(--dark); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { padding: 5px 10px; font-size: 12.5px; line-height: 1.3; color: var(--dark); border-radius: 18px; }
  .chip.card--selected { border-color: var(--red); background: var(--red-bg); }
  .chip--locked { cursor: inherit; pointer-events: none; }

  .fb-hint { font-size: 13px; color: var(--slate); margin-bottom: 6px; min-height: 20px; }
  .fb-zone { min-height: 140px; }
  .fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }
  .verdict { font-size: 14px; line-height: 1.6; color: var(--slate); margin-bottom: 8px; }
  .verdict b { color: var(--dark); }
  @media (max-width: 560px) { .screen { min-height: 1575px; } .levels { grid-template-columns: 1fr; } .fb-zone { min-height: 190px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* =========================================================
   Сколько доверить помощнику
   Модуль 4 · страница «Сколько доверять помощнику».
   Классификация: задача → уровень полномочий помощника.
   Зелёный — лучший уровень, жёлтый — допустимо (лишний контроль), красный — неверно.
   ========================================================= */

var LEVELS = ['1. Читает', '2. Черновик', '3. С подтверждением', '4. Сам'];
var LSHORT = ['читает и отвечает', 'готовит черновик', 'действует с подтверждением', 'действует сам'];

var ROWS = [
  { name: 'Раскладывать входящие письма по папкам: клиенты, коллеги, рассылки', right: 3, warn: 2,
    fb: [
      'Помощник подскажет, куда разложить письма, но раскладывать всё равно придётся вам. Это действие легко отменить, его можно доверить целиком.',
      'Черновик здесь не нужен: письма нужно просто разложить. Это действие легко отменить, его можно доверить помощнику целиком.',
      'Подтверждать каждое письмо — лишняя работа. Письмо в не той папке легко переложить, это можно доверить помощнику.',
      'Действие легко отменить, и ошибка почти ничего не стоит. Достаточно иногда заглядывать в отчёт.'
    ] },
  { name: 'Отвечать клиентам на жалобы по почте', right: 1, warn: 2,
    fb: [
      'Справка о жалобе задачу не решит: клиенту нужен ответ. Подходит черновик, который вы проверите и отправите сами.',
      'Письмо уходит клиенту, вернуть его нельзя. Помощник готовит черновик, вы правите и отправляете сами.',
      'Подтверждение одной кнопкой легко превращается в привычку нажимать не читая. Для писем клиентам надёжнее черновик, который вы отправляете сами.',
      'Письмо клиенту нельзя отменить, а ошибка в тоне или сроке дорого стоит. Отправлять такие письма сам помощник не должен.'
    ] },
  { name: 'Сравнить условия трёх договоров аренды и выписать различия', right: 0, warn: 1,
    fb: [
      'Помощник читает документы и отвечает, ничего не меняя. Вы выборочно сверяете различия с договорами.',
      'Черновик здесь не нужен: сравнение — это уже готовый ответ, его никто никуда не отправляет.',
      'Помощник ничего не делает во внешних системах, он только читает договоры. Подтверждать нечего.',
      'Действий здесь нет, только чтение. Важнее другое: договоры — конфиденциальные документы, сначала проверьте, можно ли загружать их в сервис.'
    ] },
  { name: 'Назначать встречи с кандидатами в свободные окна вашего календаря', right: 2, warn: 1,
    fb: [
      'Справка о свободных окнах встречу не назначит. Помощник должен действовать: отправлять приглашения.',
      'Отправлять каждое приглашение вручную долго. Достаточно подтверждать готовое приглашение одной кнопкой.',
      'Приглашение увидит кандидат, поэтому перед отправкой нужно ваше подтверждение. Зато искать окна вручную больше не придётся.',
      'Приглашение уходит человеку вне компании. Если помощник ошибётся с датой или пригласит не того, это сразу заметят. Без подтверждения здесь нельзя.'
    ] },
  { name: 'Менять сумму сделки в CRM-системе по письмам клиентов', right: 2, warn: 1,
    fb: [
      'Справка сделку не изменит, а задача именно в этом. Нужен уровень, на котором помощник действует.',
      'Вы сами вносите изменения по подготовленным данным — так можно. Но если писем много, удобнее подтверждать готовое изменение.',
      'Сумма сделки влияет на план и премии, ошибку потом трудно заметить. Помощник готовит изменение, вы его подтверждаете.',
      'Помощник может неверно прочитать письмо и изменить сумму, а заметят это только при закрытии месяца. Сам менять сделки он не должен.'
    ] },
  { name: 'Готовить для вас сводку продаж за неделю', right: 0, warn: 1,
    fb: [
      'Сводку читаете только вы, помощник ничего не меняет и никуда не отправляет. Достаточно иногда сверять цифры.',
      'Сводка для вас и так черновик: вы её читаете, а не отправляете. Отдельный уровень «черновик» здесь не нужен.',
      'Подтверждать нечего: помощник ничего не отправляет и не меняет.',
      'Действовать самому помощнику здесь не нужно: он только считает и пишет сводку для вас.'
    ] }
];

var state = { screen: 'intro', pick: [], checked: false, open: -1 };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2&nbsp;');
  return s.replace(/ — /g, '&nbsp;— ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1&nbsp;');
}

function grade(i) { var p = state.pick[i]; return p === ROWS[i].right ? 'ok' : (p === ROWS[i].warn ? 'warn' : 'bad'); }
function allPicked() { for (var i = 0; i < ROWS.length; i++) if (state.pick[i] === undefined) return false; return true; }

function chipClass(i, a) {
  var p = state.pick[i];
  if (!state.checked) return 'card card--interactive chip' + (p === a ? ' card--selected' : '');
  if (a === ROWS[i].right) return 'card chip chip--locked card--correct';
  if (a === p) return 'card chip chip--locked ' + (a === ROWS[i].warn ? 'card--warning' : 'card--wrong');
  return 'card chip chip--locked card--dimmed';
}
function rowClass(i) { return !state.checked ? 'row' : 'row row--click' + (i === state.open ? ' row--open' : ''); }

function rowHtml(i) {
  var chips = '';
  for (var a = 0; a < LEVELS.length; a++)
    chips += '<div class="' + chipClass(i, a) + '" onclick="choose(' + i + ',' + a + ')">' + LEVELS[a] + '</div>';
  return '<div id="row-' + i + '" class="' + rowClass(i) + '" onclick="openRow(' + i + ')">'
    + '<div class="row__head"><span class="row__name">' + ROWS[i].name + '</span>'
    + (state.checked ? '<span class="why-tag">Почему? ›</span>' : '') + '</div>'
    + '<div class="chips" id="chips-' + i + '">' + chips + '</div></div>';
}

function levelsHtml() {
  return '<div class="levels">'
    + '<div><b>1. Читает и отвечает.</b> Ничего не меняет.</div>'
    + '<div><b>2. Готовит черновик.</b> Вы проверяете и отправляете сами.</div>'
    + '<div><b>3. Действует с подтверждением.</b> Вы нажимаете «Подтвердить» перед каждым действием.</div>'
    + '<div><b>4. Действует сам.</b> Вы смотрите отчёт о сделанном.</div></div>';
}

function verdictHtml() {
  var bad = 0, warn = 0;
  for (var j = 0; j < ROWS.length; j++) { var g = grade(j); if (g === 'bad') bad++; if (g === 'warn') warn++; }
  if (!bad && !warn) return 'Вы <b>точно выбираете уровень</b>: доверяете там, где ошибку легко исправить, и оставляете контроль там, где нельзя.';
  if (!bad) return 'Рискованных решений нет. Жёлтым отмечены задачи, где контроля больше, чем нужно.';
  return 'Посмотрите задачи, отмеченные красным: где-то помощнику <b>доверено слишком много</b> или он не сможет сделать работу.';
}

function zoneHtml() {
  if (!state.checked) return '<div class="hint">После проверки здесь появится разбор.</div>';
  var i = state.open, r = ROWS[i], g = grade(i);
  var cls = { ok: 'feedback--success', warn: 'feedback--warning', bad: 'feedback--error' }[g];
  var head = { ok: 'Верно', warn: 'Допустимо, но…', bad: 'Неверно' }[g] + ' · лучше всего — ' + LSHORT[r.right];
  return '<p class="verdict">' + verdictHtml() + '</p>'
    + '<div class="feedback ' + cls + '"><div class="feedback__head">' + head + '</div>' + r.fb[state.pick[i]] + '</div>';
}

function renderIntro() {
  return '<div class="screen__body">'
    + '<h1 class="page-title">Сколько доверить <span>помощнику</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Шесть задач, которые руководитель хочет отдать ИИ-помощнику. Для каждой выберите уровень полномочий: сколько помощник может делать без вас.</p>'
    + levelsHtml()
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderTask() {
  var rows = '';
  for (var i = 0; i < ROWS.length; i++) rows += rowHtml(i);
  var bottom = !state.checked
    ? '<button id="check-btn" class="btn btn--primary btn--full mt-md" onclick="check()"' + (allPicked() ? '' : ' disabled') + '>Проверить →</button>'
    : '<div class="legend-box"><span class="legend-tag">Итог</span>'
      + 'Уровень решают два вопроса: <strong>можно ли отменить действие</strong> и <strong>кто увидит результат</strong>. Если отменить нельзя или результат увидят клиенты, не поднимайтесь выше уровня «действует с подтверждением».</div>'
      + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
  return '<div class="screen__body">'
    + '<p class="lead-text">Сколько помощник может делать без вас в каждой задаче?</p>'
    + rows
    + '<div class="fb-hint mt-md">' + (state.checked ? 'Нажмите на задачу, чтобы увидеть разбор.' : '') + '</div>'
    + '<div id="fbbox" class="fb-zone">' + zoneHtml() + '</div>'
    + '</div>' + bottom;
}

function render() {
  var body = state.screen === 'intro' ? renderIntro() : renderTask();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function choose(i, a) {
  if (state.checked) return;
  state.pick[i] = a;
  var box = document.getElementById('chips-' + i);
  for (var k = 0; k < box.children.length; k++) box.children[k].className = chipClass(i, k);
  document.getElementById('check-btn').disabled = !allPicked();
  notifyHeight();
}

function openRow(i) {
  if (!state.checked || i === state.open) return;
  var prev = state.open;
  state.open = i;
  document.getElementById('row-' + prev).className = rowClass(prev);
  document.getElementById('row-' + i).className = rowClass(i);
  document.getElementById('fbbox').innerHTML = nb(zoneHtml());
  notifyHeight();
}

function firstOpen() {
  for (var i = 0; i < ROWS.length; i++) if (grade(i) === 'bad') return i;
  for (i = 0; i < ROWS.length; i++) if (grade(i) === 'warn') return i;
  return 0;
}

function start() { state.screen = 'task'; state.pick = []; state.checked = false; state.open = -1; render(); }
function check() { state.checked = true; state.open = firstOpen(); render(); }
function restart() { state.screen = 'intro'; render(); }

render();
</script>
</body>
</html>
