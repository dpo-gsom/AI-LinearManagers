<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сколько доверить помощнику</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 777px; display: flex; flex-direction: column; }
  .screen__body { display: flex; flex-direction: column; }

  .label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); margin: 14px 0 6px; }
  .task { font-family: var(--font-display); font-size: 21px; line-height: 1.3; font-weight: 700; color: var(--dark); margin: 4px 0 2px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 11px 14px; font-size: 14px; line-height: 1.5; color: var(--slate); }
  .opt__name { display: block; font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 2px; }
  .opt__n { color: var(--red); margin-right: 6px; }

  .levels { display: flex; flex-direction: column; gap: 6px; }
  .lv { display: flex; gap: 10px; align-items: baseline; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 12px; font-size: 14px; line-height: 1.45; color: var(--slate); }
  .lv b { color: var(--dark); }
  .lv__n { flex: 0 0 auto; font-weight: 700; color: var(--red); }

  .fb-zone { min-height: 128px; margin-top: 12px; }
  .fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }

  .sum { display: flex; flex-direction: column; gap: 6px; }
  .sum__row { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; padding: 8px 12px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.45; color: var(--dark); }
  .sum__row--ok { background: var(--green-bg); }
  .sum__row--warn { background: var(--amber-bg); }
  .sum__row--bad { background: var(--red-bg); }
  .sum__lvl { flex: 0 0 auto; font-size: 13px; font-weight: 600; text-align: right; color: var(--slate); max-width: 48%; }
  .verdict { font-size: 14px; line-height: 1.6; color: var(--slate); margin: 4px 0 2px; }
  .verdict b { color: var(--dark); }

  @media (max-width: 560px) {
    .screen { min-height: 933px; }
    .task { font-size: 19px; }
    .fb-zone { min-height: 150px; }
    }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* =========================================================
   Сколько доверить помощнику
   Модуль 4 · страница «Сколько доверять помощнику».
   Шесть задач, каждая на своём экране. Для каждой три уровня полномочий
   с примером того, как на этом уровне выглядит доступ.
   Зелёный — верно, жёлтый — допустимо, но не лучший вариант, красный — неверно.
   ========================================================= */

var LEVELS = ['Только готовит', 'Делает после вашего «да»', 'Делает сам'];
var LEVEL_DESC = [
  'Отвечает, считает, пишет. Отправить или изменить что-то сам не может.',
  'Готовит действие и выполняет его, когда вы подтвердите.',
  'Действует без вас и присылает отчёт о сделанном.'
];

/* right — верный уровень, warn — допустимый (жёлтый), -1 если нет */
var TASKS = [
  { short: 'Разложить письма по папкам', name: 'Раскладывать входящие письма по папкам: клиенты, коллеги, рассылки', right: 2, warn: 1,
    opts: [
      'Помощник читает входящие и присылает список: какое письмо в какую папку. Раскладываете вы.',
      'Помощник раскладывает письма, но перед каждым спрашивает: «Перенести в папку „Клиенты“?»',
      'Помощник сам перемещает письма по папкам и раз в день присылает, что куда разложил.'
    ],
    fb: [
      ['Неверно · помощник почти не помогает', 'Письма так и лежат неразобранными, пока вы не разложите их по списку. Ошибка здесь почти ничего не стоит: письмо в не той папке легко переложить.'],
      ['Допустимо, но…', 'Подтверждать каждое письмо — почти та же ручная работа. Результат видите только вы, и его легко исправить, поэтому задачу можно доверить целиком.'],
      ['Верно · можно доверить целиком', 'Результат видите только вы, а письмо в не той папке легко переложить. Достаточно иногда заглядывать в отчёт.']
    ] },
  { short: 'Оплатить счета поставщиков', name: 'Оплачивать счета поставщиков', right: 0, warn: 1,
    opts: [
      'Помощник сверяет счета с договорами и готовит список платежей. Платежи в банке создаёте вы.',
      'Помощник создаёт платежи в банке, а вы подтверждаете каждый кодом из СМС.',
      'Помощник сам оплачивает счета до 50 000 ₽ и раз в неделю присылает выписку.'
    ],
    fb: [
      ['Верно · доступа к банку нет', 'Деньги, ушедшие поставщику, вернуть трудно. Помощник берёт на себя сверку, а платёж создаёте вы и видите каждую сумму.'],
      ['Допустимо, но…', 'Ввод кода из СМС быстро становится привычкой: его вводят, не глядя на сумму и получателя. Для денег надёжнее, чтобы у помощника не было доступа к банку.'],
      ['Неверно · платёж не отменить', 'Ошибка в реквизитах стоит всей суммы, и вернуть её трудно. Даже с лимитом помощник не должен платить сам.']
    ] },
  { short: 'Назначить собеседования', name: 'Назначать собеседования с кандидатами на свободное время в вашем календаре', right: 1, warn: 0,
    opts: [
      'Помощник подбирает три свободных окна и пишет текст приглашения. Отправляете его вы.',
      'Помощник готовит приглашение и спрашивает: «Кандидат на должность бухгалтера, четверг, 15:00. Отправить?»',
      'Помощник видит ваш календарь и сам рассылает кандидатам приглашения на свободное время.'
    ],
    fb: [
      ['Допустимо, но…', 'Так безопасно, но приглашения по-прежнему отправляете вы. Ошибку в дате можно исправить вторым письмом, поэтому достаточно подтверждать готовое приглашение.'],
      ['Верно · нужно ваше «да»', 'Приглашение увидит человек вне компании, поэтому перед отправкой нужно ваше подтверждение. Ошибку можно исправить, поэтому отправлять вручную не обязательно.'],
      ['Неверно · кандидат увидит ошибку первым', 'Приглашение сразу уходит кандидату. Если помощник ошибётся с датой или займёт время, которое вы держали для другого, кандидат узнает об этом раньше вас.']
    ] },
  { short: 'Внести поручения в список задач', name: 'Вносить в ваш личный список задач поручения, которые вы получили на совещаниях', right: 2, warn: 1,
    opts: [
      'После совещания помощник присылает список поручений. В свой список задач их вносите вы.',
      'Помощник предлагает задачу и ждёт ответа: «Добавить „Отчёт для финансового отдела“ на пятницу?»',
      'Помощник сам добавляет поручения в ваш список задач и присылает, что добавил.'
    ],
    fb: [
      ['Неверно · помощник почти не помогает', 'Вы переписываете список вручную, и времени почти не экономите. Список задач видите только вы, лишнюю задачу легко удалить.'],
      ['Допустимо, но…', 'Подтверждать каждую задачу долго. Ошибку здесь видите только вы, и исправляется она в одно нажатие.'],
      ['Верно · можно доверить целиком', 'Список задач личный: лишнюю задачу легко удалить, а пропущенную — заметить в отчёте помощника.']
    ] },
  { short: 'Подписать акты подрядчиков', name: 'Подписывать акты выполненных работ с подрядчиками в системе электронного документооборота', right: 0, warn: -1,
    opts: [
      'Помощник сверяет акты с договорами и пишет, что не совпадает. Подписываете вы своей электронной подписью.',
      'Помощник получает доступ к вашей электронной подписи и подписывает акт после вашего «да».',
      'Помощник сам подписывает акты, которые совпали с договором, и присылает список подписанного.'
    ],
    fb: [
      ['Верно · подпись остаётся вашей', 'Подписанный акт — основание для оплаты, отозвать его трудно. Помощник берёт на себя сверку, а подписываете вы.'],
      ['Неверно · подпись нельзя передавать', 'Электронная подпись — ваша личная, как подпись ручкой. Передавать её помощнику нельзя, даже если он спрашивает перед каждым документом.'],
      ['Неверно · подпись не отозвать', 'Помощник может не заметить расхождение в объёме работ, а подписанный акт уже уйдёт на оплату. И электронную подпись передавать ему нельзя.']
    ] },
  { short: 'Ответить клиентам о доставке', name: 'Отвечать клиентам на типовые вопросы о сроках доставки', right: 1, warn: 0,
    opts: [
      'Помощник пишет ответ и кладёт его в черновики почты. Открываете и отправляете его вы.',
      'Помощник показывает ответ рядом с письмом клиента. Вы читаете его и нажимаете «Отправить».',
      'Помощник сразу отвечает клиентам, а ответы вы видите в папке «Отправленные».'
    ],
    fb: [
      ['Допустимо, но…', 'Так можно, но времени уходит больше, а читаете вы ответ так же. Вопросы типовые, ошибку можно исправить вторым письмом.'],
      ['Верно · нужно ваше «да»', 'Ответ увидит клиент, поэтому перед отправкой нужно ваше подтверждение. Вопросы типовые, и ошибку можно исправить вторым письмом.'],
      ['Неверно · клиент увидит ошибку первым', 'Клиент получит ответ раньше, чем его прочитаете вы. Если помощник пообещает не тот срок, отвечать за это будете вы.']
    ] }
];

var state = { screen: 'intro', t: 0, pick: [] };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"„])([а-яёА-ЯЁ]{1,2}) /g, '$1$2&nbsp;');
  return s.replace(/ — /g, '&nbsp;— ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1&nbsp;');
}

function kind(t, a) {
  if (a === TASKS[t].right) return 'ok';
  if (a === TASKS[t].warn) return 'warn';
  return 'bad';
}

function optClass(t, a) {
  var p = state.pick[t];
  if (p === undefined) return 'card card--interactive opt';
  if (a === p) return 'card card--interactive opt ' + { ok: 'card--correct', warn: 'card--warning', bad: 'card--wrong' }[kind(t, a)];
  return 'card card--interactive opt';
}

function zoneHtml(t) {
  var p = state.pick[t];
  if (p === undefined) return '<div class="hint">Выберите уровень, и здесь появится разбор.</div>';
  var k = kind(t, p), f = TASKS[t].fb[p];
  var cls = { ok: 'feedback--success', warn: 'feedback--warning', bad: 'feedback--error' }[k];
  var extra = k === 'ok' ? '' : ' Лучше всего здесь подходит уровень «' + LEVELS[TASKS[t].right].toLowerCase().replace('«да»', '„да“') + '».';
  return '<div class="feedback ' + cls + '"><div class="feedback__head">' + f[0] + '</div>' + f[1] + extra + '</div>';
}

function progressHtml() {
  var n = state.t + 1;
  return '<div class="progress"><div class="progress__meta"><span class="progress__label">Задача</span>'
    + '<span class="progress__fraction"><em>' + n + '</em> / ' + TASKS.length + '</span></div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (n / TASKS.length * 100) + '%"></div></div></div>';
}

function levelsHtml() {
  var s = '';
  for (var i = 0; i < LEVELS.length; i++)
    s += '<div class="lv"><span class="lv__n">' + (i + 1) + '</span><span><b>' + LEVELS[i] + '.</b> ' + LEVEL_DESC[i] + '</span></div>';
  return '<div class="levels">' + s + '</div>';
}

function renderIntro() {
  return '<div class="screen__body">'
    + '<h1 class="page-title">Сколько доверить <span>помощнику</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Шесть задач для ИИ-помощника. Для каждой выберите, какой доступ ему дать. Варианты описаны так, как это выглядело бы в работе.</p>'
    + '<div class="label">Три уровня полномочий</div>' + levelsHtml()
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderTask() {
  var t = state.t, T = TASKS[t], s = '';
  for (var a = 0; a < LEVELS.length; a++)
    s += '<div id="opt-' + a + '" class="' + optClass(t, a) + '" onclick="pick(' + a + ')">'
      + '<span class="opt__name"><span class="opt__n">' + (a + 1) + '</span>' + LEVELS[a] + '</span>' + T.opts[a] + '</div>';
  var last = t === TASKS.length - 1;
  return '<div class="screen__body">' + progressHtml()
    + '<div class="task">' + T.name + '</div>'
    + '<div class="label">Какой доступ дать?</div>'
    + '<div class="opts">' + s + '</div>'
    + '<div id="fbbox" class="fb-zone">' + zoneHtml(t) + '</div>'
    + '</div>'
    + '<button id="next-btn" class="btn btn--primary btn--full mt-md" onclick="next()"' + (state.pick[t] === undefined ? ' disabled' : '') + '>'
    + (last ? 'К итогам →' : 'Следующая задача →') + '</button>';
}

function renderResult() {
  var rows = '', ok = 0;
  for (var t = 0; t < TASKS.length; t++) {
    var k = kind(t, state.pick[t]);
    if (k === 'ok') ok++;
    var lvl = k === 'ok' ? LEVELS[TASKS[t].right] : 'лучше: ' + LEVELS[TASKS[t].right].toLowerCase();
    rows += '<div class="sum__row sum__row--' + k + '"><span>' + TASKS[t].short + '</span><span class="sum__lvl">' + lvl + '</span></div>';
  }
  var verdict = ok === TASKS.length
    ? 'Вы <b>уверенно различаете</b>, когда помощнику можно действовать самому, а когда нужно ваше слово.'
    : ok >= 4 ? 'Почти везде вы выбрали тот же уровень, что и в разборе. Жёлтым и красным отмечены задачи, где лучше подходит другой.'
    : 'Уровни пока путаются. Жёлтым и красным отмечены задачи, где лучше подходит другой уровень. Правило — в итоге ниже.';
  return '<div class="screen__body">'
    + '<h1 class="page-title">Ваши <span>решения</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="verdict">' + verdict + '</p>'
    + '<div class="sum mt-sm">' + rows + '</div>'
    + '<div class="legend-box mt-md"><span class="legend-tag">Итог</span>'
    + 'Действие нельзя отменить, и ошибка дорого стоит — помощник <strong>только готовит</strong>. '
    + 'Результат увидят коллеги или клиенты, но ошибку можно исправить — он <strong>делает после вашего «да»</strong>. '
    + 'Результат видите только вы, и его легко отменить — он <strong>делает сам</strong>.</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full mt-md" onclick="restart()">Пройти заново</button>';
}

function render() {
  var body = state.screen === 'intro' ? renderIntro() : state.screen === 'task' ? renderTask() : renderResult();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function pick(a) {
  var t = state.t;
  state.pick[t] = a;
  for (var i = 0; i < LEVELS.length; i++) document.getElementById('opt-' + i).className = optClass(t, i);
  document.getElementById('fbbox').innerHTML = nb(zoneHtml(t));
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function next() {
  if (state.t < TASKS.length - 1) { state.t++; render(); window.scrollTo(0, 0); }
  else { state.screen = 'result'; render(); }
}

function start() { state.screen = 'task'; state.t = 0; state.pick = []; render(); }
function restart() { state.screen = 'intro'; render(); }

render();
</script>
</body>
</html>
