<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>От банального к полезному</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 803px; display: flex; flex-direction: column; }
.screen__body { display: flex; flex-direction: column; }
.case-card { padding: 0 2px; }
.case-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--dark); line-height: 1.25; margin-bottom: 6px; }
.case-text { font-size: 14px; line-height: 1.6; color: var(--slate); }
.bubble-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); margin-bottom: 4px; }
.bubble { font-size: 14px; line-height: 1.6; padding: 12px 16px; }
.bubble--user { background: var(--sand); border-radius: 16px 16px 4px 16px; color: var(--dark); margin-left: 8%; }
.bubble--ai { background: var(--white); border: 1.5px solid var(--border); border-left: 4px solid var(--red); border-radius: 4px 16px 16px 16px; color: var(--slate); margin-right: 4%; }
.bubble--doc { background: var(--cream); border: 1.5px dashed var(--border); border-radius: var(--radius-md); color: var(--slate); }
.bubble-wrap--user { text-align: right; }
.bubble-wrap--user .bubble { text-align: left; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { padding: 12px 14px; font-size: 14px; line-height: 1.45; color: var(--dark); }
.opt--locked { cursor: default; pointer-events: none; }
.fb-zone { min-height: 150px; }
.fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }
.sum-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.sum-row:last-of-type { border-bottom: none; }
.sum-row__name { flex: 1; color: var(--dark); line-height: 1.35; }
.sum-row__name small { display: block; font-size: 12px; color: var(--slate); }
.mark { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.mark--ok   { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
.mark--warn { background: var(--amber-bg); border: 1.5px solid var(--amber); color: var(--amber); }
.mark--bad  { background: var(--red-bg);   border: 1.5px solid var(--red);   color: var(--red);   }
.sum-verdict { font-size: 14px; line-height: 1.65; color: var(--slate); }
.sum-verdict b { color: var(--dark); }
@media (max-width: 560px) {
    .bubble--user { margin-left: 0; }
  .bubble--ai { margin-right: 0; }
  .fb-zone { min-height: 240px; }
}
  @media (max-width: 560px) { .screen { min-height: 1023px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* Модуль 2 · страница «Идеи и варианты». Один штурм в три шага:
   убрать очевидное, выйти за привычное, проверить идею премортемом. */

var CFG = {
  title: 'От банального ',
  titleSpan: 'к полезному',
  intro: 'Руководитель группы колл-центра Алексей теряет новичков: из десяти принятых через два месяца остаются четверо. Он пытается найти решение проблемы, используя метод мозгового штурма с нейросетью. Помогите ему за три шага дойти от банальных идей до идеи, которую не стыдно показать директору.',
  progressLabel: 'Шаг',
  question: 'Что Алексею написать нейросети?',
  nextLabel: 'Следующий шаг',
  finalTitle: 'Как прошёл штурм',
  allRight: 'Вы <b>ведёте штурм сами</b>: отсекаете очевидное, подталкиваете к необычному и проверяете идею на прочность.',
  someWrong: 'Вернитесь к шагам:',
  summary: 'Первый список идей у нейросети всегда самый предсказуемый. Это разминка, а не результат. <strong>Уберите очевидное, задайте ограничения, дайте приём</strong>, который выведет за привычные рамки. А выбирать идею и отвечать за неё будете вы.'
};

var CASES = [
  {
    title: 'Первый список',
    bubbles: [
      { who: 'user', text: 'Как снизить текучесть новичков в колл-центре? Дай идеи.' },
      { who: 'ai', text: '1. Повысить зарплату. 2. Ввести систему наставничества. 3. Проводить тимбилдинги. 4. Внедрить бонусы за стаж. 5. Улучшить условия труда.' }
    ],
    right: 'убрать очевидное',
    options: [
      { t: '«Дай ещё 15 идей, не повторяя эти пять. Для каждой коротко напиши, как внедрить её в колл-центре и сколько это займёт»', level: 'warn',
        fb: 'Нейросеть добавит идеи того же уровня — «обучение», «корпоративная культура» — и потратит силы на планы внедрения. Сначала уберите то, на что нет бюджета, и не просите оценок: отбор потом.' },
      { t: '«Выбери из этих пяти идей самую эффективную для колл-центра и распиши план её внедрения на первый месяц»', level: 'bad',
        fb: 'Штурм ещё не начался: все пять идей Алексей знал и без нейросети. План внедрения — следующая задача, а сначала нужно найти идеи получше очевидных.' },
      { t: '«Убери зарплату, бонусы и тимбилдинги — на них нет бюджета. Дай 15 идей, которые я могу начать сам на этой неделе. Пока не оценивай их»', level: 'ok',
        fb: 'Вы убрали очевидное и задали рамки: без бюджета, своими силами, на этой неделе. «Пока не оценивай» — главное правило штурма: сначала много идей, отбор потом.' }
    ]
  },
  {
    title: 'Выйти за привычное',
    text: 'Теперь в списке 15 идей: чек-лист первого дня, разбор звонков, приветственное письмо. Полезно, но всё это уже где-то было. Алексей хочет хотя бы пару необычных вариантов.',
    right: 'приём вместо призыва',
    options: [
      { t: '«Будь креативнее: предложи десять смелых идей, которых нет ни в одной статье про адаптацию. Не бойся странных вариантов»', level: 'warn',
        fb: 'Призыв почти не меняет результат: нейросеть добавит громких слов, а идеи останутся теми же. Ей нужен способ выйти за рамки, а не просьба это сделать.' },
      { t: '«Примени инверсию: придумай пять абсурдных способов гарантированно отпугнуть новичка за первые две недели. Потом переверни каждый в практичную идею»', level: 'ok',
        fb: 'Приём «инверсия» из латерального мышления. Вредные идеи придумывать легко: «сразу дать самые трудные звонки», «никогда не говорить, хорошо ли он работает». Перевёрнутые, они дают то, чего не было в списке: первую неделю — только простые звонки, разбор с руководителем каждую пятницу.' },
      { t: '«Какие решения против текучести новичков используют лучшие колл-центры? Приведи три примера с цифрами результата»', level: 'bad',
        fb: 'Нейросеть охотно сочинит «кейс крупной компании, где текучесть снизилась на 40%». Проверить его вы не сможете. Если нужны чужие практики, ищите их в источниках, а не в ответе нейросети.' }
    ]
  },
  {
    title: 'Перед директором',
    text: 'Алексей выбрал идею из перевёрнутого списка: в первые две недели руководитель каждую пятницу 15 минут разбирает с новичком его звонки — что получилось и что улучшить. Завтра он покажет идею директору.',
    right: 'проверка на провал',
    options: [
      { t: '«Напиши для директора обоснование: почему идея сработает, какие у неё плюсы и насколько она снизит текучесть»', level: 'bad',
        fb: 'Нейросеть найдёт аргументы за любую идею, а цифры эффекта придумает. Директор будет искать не плюсы, а слабые места. Найдите их первым.' },
      { t: '«Представь, что через три месяца идея провалилась. Назови пять причин, почему это случилось, и как каждую предотвратить»', level: 'ok',
        fb: 'Это премортем: вместо «что может пойти не так» вы говорите «уже пошло не так, почему?». Так находится больше рисков: у руководителя нет времени на всех новичков, разбор превращается в разнос, встречи переносят из-за плана по звонкам.' },
      { t: '«Оцени идею по пяти критериям — стоимость, сложность, скорость, риск, эффект — от 1 до 10 и посчитай общий балл»', level: 'warn',
        fb: 'Таблица выглядит солидно, но баллы ничего не скажут ни вам, ни директору: непонятно, за что они снижены. Попросите назвать, как идея может провалиться и что с этим делать.' }
    ]
  }
];

/* ─── Механика: выбор ответа, разбор, итоги ─── */

var state = { screen: 'intro', i: 0, answers: [] };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2 ');
  return s.replace(/ — /g, ' — ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1 ');
}

function rightIdx(c) {
  for (var k = 0; k < c.options.length; k++) if (c.options[k].level === 'ok') return k;
}

function lockedClass(idx, ans) {
  var c = CASES[state.i];
  var cls = 'card opt opt--locked';
  if (idx === rightIdx(c)) return cls + ' card--correct';
  if (idx === ans) return cls + (c.options[idx].level === 'warn' ? ' card--warning' : ' card--wrong');
  return cls + ' card--dimmed';
}

function optionsHtml() {
  var c = CASES[state.i];
  var ans = state.answers[state.i];
  var h = '<div class="options">';
  for (var k = 0; k < c.options.length; k++) {
    if (ans === undefined) h += '<div class="card card--interactive opt" data-opt="' + k + '" onclick="pick(' + k + ')">' + c.options[k].t + '</div>';
    else h += '<div class="' + lockedClass(k, ans) + '" data-opt="' + k + '">' + c.options[k].t + '</div>';
  }
  return h + '</div>';
}

var FB_CLASS = { ok: 'feedback--success', warn: 'feedback--warning', bad: 'feedback--error' };

function feedbackHtml(ans) {
  if (ans === undefined) return '<div class="hint">Выберите ответ — здесь появится разбор.</div>';
  var c = CASES[state.i];
  var o = c.options[ans];
  var head = o.level === 'ok' ? 'Верно · ' + c.right : (o.level === 'warn' ? 'Допустимо, но не лучший вариант' : 'Неверно · ' + c.right);
  return nb('<div class="feedback ' + FB_CLASS[o.level] + '">'
    + '<div class="feedback__head">' + head + '</div>'
    + '<div>' + o.fb + '</div>'
    + '</div>');
}

function progressHtml() {
  return '<div class="progress">'
    + '<div class="progress__meta">'
    +   '<span class="progress__label">' + CFG.progressLabel + '</span>'
    +   '<span class="progress__fraction"><em>' + (state.i + 1) + '</em> / ' + CASES.length + '</span>'
    + '</div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (state.i / CASES.length * 100) + '%"></div></div>'
    + '</div>';
}

var LABEL = { user: 'Промпт', ai: 'Ответ нейросети', doc: 'Исходные данные' };

function bubblesHtml(c) {
  var list = c.bubbles || [];
  var h = '';
  for (var k = 0; k < list.length; k++) {
    var b = list[k];
    var label = b.label || LABEL[b.who];
    h += '<div class="mt-sm bubble-wrap--' + b.who + '">'
      + '<div class="bubble-label">' + label + '</div>'
      + '<div class="bubble bubble--' + b.who + '">' + b.text + '</div>'
      + '</div>';
  }
  return h;
}

function renderIntro() {
  return '<div class="screen__body">'
    +   '<h1 class="page-title">' + CFG.title + '<span>' + CFG.titleSpan + '</span></h1>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">' + CFG.intro + '</p>'
    +   (CFG.introExtra || '')
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderQuestion() {
  var c = CASES[state.i];
  var ans = state.answers[state.i];
  return '<div class="screen__body">'
    +   progressHtml()
    +   '<div class="case-card mt-sm">'
    +     '<div class="case-title">' + c.title + '</div>'
    +     (c.text ? '<p class="case-text">' + c.text + '</p>' : '')
    +   '</div>'
    +   bubblesHtml(c)
    +   '<div class="question-text mt-md">' + (c.question || CFG.question) + '</div>'
    +   '<div id="optbox" class="mt-sm">' + optionsHtml() + '</div>'
    +   '<div id="fbbox" class="fb-zone mt-sm">' + feedbackHtml(ans) + '</div>'
    + '</div>'
    + '<div class="nav-bar">'
    +   '<button id="next-btn" class="btn btn--primary btn--full" onclick="next()"' + (ans === undefined ? ' disabled' : '') + '>'
    +     (state.i === CASES.length - 1 ? 'К итогам →' : CFG.nextLabel + ' →')
    +   '</button>'
    + '</div>';
}

var MARK = { ok: '✓', warn: '~', bad: '✕' };

function renderFinal() {
  var rows = '', misses = [];
  for (var n = 0; n < CASES.length; n++) {
    var c = CASES[n];
    var lv = c.options[state.answers[n]].level;
    if (lv !== 'ok') misses.push(c.right);
    rows += '<div class="sum-row">'
      + '<div class="sum-row__name">' + c.title + '<small>' + c.right.charAt(0).toUpperCase() + c.right.slice(1) + '</small></div>'
      + '<span class="mark mark--' + lv + '">' + MARK[lv] + '</span>'
      + '</div>';
  }
  var verdict = misses.length === 0 ? CFG.allRight : CFG.someWrong + ' <b>' + misses.join(', ') + '</b>.';
  return '<div class="screen__body">'
    +   '<h2 class="section-title">' + CFG.finalTitle + '</h2>'
    +   '<div class="divider"></div>'
    +   rows
    +   '<p class="sum-verdict mt-sm">' + verdict + '</p>'
    +   '<div class="legend-box">'
    +     '<span class="legend-tag">Итог</span>'
    +     CFG.summary
    +   '</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
}

function render() {
  var body;
  if (state.screen === 'intro') body = renderIntro();
  else if (state.screen === 'q') body = renderQuestion();
  else body = renderFinal();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function start() { state.screen = 'q'; state.i = 0; state.answers = []; render(); }

function pick(idx) {
  if (state.answers[state.i] !== undefined) return;
  state.answers[state.i] = idx;
  var opts = document.querySelectorAll('#optbox [data-opt]');
  for (var k = 0; k < opts.length; k++) { opts[k].className = lockedClass(k, idx); opts[k].onclick = null; }
  document.getElementById('fbbox').innerHTML = feedbackHtml(idx);
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function next() {
  if (state.i === CASES.length - 1) state.screen = 'final';
  else state.i++;
  render();
}

function restart() { state.screen = 'intro'; state.i = 0; state.answers = []; render(); }

render();
</script>
</body>
</html>
