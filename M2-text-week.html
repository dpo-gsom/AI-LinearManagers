<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ваша неделя в текстах</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 1200px; display: flex; flex-direction: column; }
.screen__body { display: flex; flex-direction: column; }
  .grp { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slate); margin: 14px 0 6px; }
  .q { padding: 10px 14px; font-size: 14px; line-height: 1.4; color: var(--dark); display: flex; gap: 10px; align-items: flex-start; }
  .q__box { width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; margin-top: 1px; font-size: 12px; line-height: 15px; text-align: center; color: var(--white); }
  .q--on .q__box { background: var(--red); border-color: var(--red); }
  .qs { display: flex; flex-direction: column; gap: 6px; }
  .route { padding: 12px 14px; }
  .route__page { font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: 1px; text-transform: uppercase; }
  .route__title { font-weight: 600; color: var(--dark); font-size: 15px; margin: 2px 0 4px; }
  .route__tasks { font-size: 13px; color: var(--slate); line-height: 1.5; }
  @media (max-width: 560px) { .screen { min-height: 1373px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* Модуль 2 · первая страница. Слушатель отмечает тексты, которые пишет
   за неделю, и получает маршрут по модулю: какие страницы ему важнее. */

var PAGES = {
  2: 'Выжимка: коротко о главном',
  3: 'Идеи и варианты',
  4: 'Наверх: служебная записка и отчёт',
  5: 'Вниз: поручение сотруднику',
  6: 'Трудное сообщение',
  7: 'Тон и адресат'
};

var GROUPS = [
  { name: 'Для себя', items: [
    { t: 'Прочитать длинный документ, регламент, переписку и понять главное', p: 2 },
    { t: 'Разослать итоги встречи или планёрки', p: 2 },
    { t: 'Придумать, как решить проблему в команде', p: 3 },
    { t: 'Проверить идею перед тем, как предлагать её руководству', p: 3 }
  ]},
  { name: 'Наверх', items: [
    { t: 'Служебная записка с просьбой: бюджет, люди, оборудование', p: 4 },
    { t: 'Еженедельный отчёт или статус по проекту', p: 4 }
  ]},
  { name: 'Вниз', items: [
    { t: 'Поручение или задание сотруднику', p: 5 },
    { t: 'Повестка встречи', p: 5 },
    { t: 'Обратная связь или оценка работы сотрудника', p: 6 },
    { t: 'Объявление команде об изменениях', p: 7 }
  ]},
  { name: 'Вбок и наружу', items: [
    { t: 'Ответ на резкое письмо смежника или жалобу клиента', p: 6 },
    { t: 'Отказ: в отпуске, в просьбе, в сроках', p: 6 },
    { t: 'Письмо клиенту или подрядчику', p: 7 },
    { t: 'Инструкция или памятка простым языком', p: 7 }
  ]}
];

var state = { picked: {}, done: false };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2 ');
  return s.replace(/ — /g, ' — ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1 ');
}

function key(g, i) { return g + '-' + i; }
function count() { var n = 0; for (var k in state.picked) if (state.picked[k]) n++; return n; }

function renderPick() {
  var h = '';
  for (var g = 0; g < GROUPS.length; g++) {
    h += '<div class="grp">' + GROUPS[g].name + '</div><div class="qs">';
    for (var i = 0; i < GROUPS[g].items.length; i++) {
      var on = !!state.picked[key(g, i)];
      h += '<div class="card card--interactive q' + (on ? ' q--on' : '') + '" onclick="toggle(\'' + key(g, i) + '\')">'
        + '<span class="q__box">' + (on ? '✓' : '') + '</span><span>' + GROUPS[g].items[i].t + '</span></div>';
    }
    h += '</div>';
  }
  return '<h1 class="page-title">Ваша неделя <span>в текстах</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Отметьте задачи, которые бывают у вас хотя бы раз в неделю. Покажем, с каких страниц модуля начать.</p>'
    + h
    + '<button class="btn btn--primary btn--full mt-md" onclick="finish()"' + (count() ? '' : ' disabled') + '>Показать маршрут →</button>';
}

function renderRoute() {
  var byPage = {};
  for (var g = 0; g < GROUPS.length; g++)
    for (var i = 0; i < GROUPS[g].items.length; i++)
      if (state.picked[key(g, i)]) {
        var it = GROUPS[g].items[i];
        (byPage[it.p] = byPage[it.p] || []).push(it.t.charAt(0).toLowerCase() + it.t.slice(1));
      }
  var order = Object.keys(byPage).sort(function (a, b) { return byPage[b].length - byPage[a].length || a - b; });
  var h = '';
  for (var n = 0; n < order.length; n++) {
    var p = order[n];
    h += '<div class="card route mt-sm"><div class="route__page">Страница ' + p + '</div>'
      + '<div class="route__title">' + PAGES[p] + '</div>'
      + '<div class="route__tasks">' + byPage[p].join('; ') + '</div></div>';
  }
  return '<h1 class="page-title">Ваш <span>маршрут</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Начните с этих страниц: сверху — те, где больше ваших задач. Остальные тоже пригодятся, а на последней странице собраны все промпты модуля.</p>'
    + h
    + '<div class="legend-box"><span class="legend-tag">Совет</span>Пока читаете модуль, держите под рукой один свой реальный текст из списка. На каждой странице пробуйте приём на нём — так к концу модуля у вас будет готовый результат, а не только конспект.</div>'
    + '<button class="btn btn--secondary btn--full" onclick="restart()">Выбрать заново</button>';
}

function render() {
  var body = state.done ? renderRoute() : renderPick();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function toggle(k) { state.picked[k] = !state.picked[k]; render(); }
function finish() { state.done = true; render(); }
function restart() { state.picked = {}; state.done = false; render(); }

render();
</script>
</body>
</html>
