<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Соберите помощника</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* min-height = максимум по всем состояниям: 700px и 360/500px */
  .screen { min-height: 693px; display: flex; flex-direction: column; }
  .screen__body { display: flex; flex-direction: column; }

  .task { font-size: 15px; line-height: 1.6; color: var(--dark); font-weight: 600; margin: 6px 0 4px; }
  .note { font-size: 13px; color: var(--slate); margin-bottom: 10px; }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .part { position: relative; padding: 10px 12px 10px 16px; border-radius: var(--radius-md); }
  .part::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 2px; background: var(--c); }
  .part__head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .part__name { font-size: 14px; font-weight: 700; color: var(--dark); }
  .part__hint { font-size: 12.5px; color: var(--slate); line-height: 1.4; margin-top: 2px; }
  .part__mark { font-size: 12px; font-weight: 600; color: var(--dark); white-space: nowrap; }
  .part.card--selected { border-color: var(--dark); background: var(--sand); box-shadow: inset 0 0 0 1px var(--dark); }
  .part--info { border-color: var(--border); background: var(--white); }
  .part--locked { cursor: pointer; }
  .part--locked:hover { transform: none; box-shadow: none; }
  .part--open { box-shadow: 0 0 0 2px var(--dark) !important; }

  .fb-hint { font-size: 13px; color: var(--slate); margin-bottom: 6px; min-height: 20px; }
  .fb-zone { min-height: 150px; }
  .fb-zone .hint { font-size: 13px; color: var(--slate); text-align: center; padding: 18px 10px; border: 1.5px dashed var(--border); border-radius: var(--radius-md); }
  .verdict { font-size: 14px; line-height: 1.6; color: var(--slate); margin-bottom: 8px; }
  .verdict b { color: var(--dark); }

  .sum { margin-top: 8px; padding: 10px 14px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 14px; line-height: 1.5; color: var(--slate); }
  .sum b { color: var(--dark); }
  @media (max-width: 560px) {
    .screen { min-height: 1047px; }
    .parts { grid-template-columns: 1fr; gap: 6px; }
    .part { padding: 8px 12px 8px 16px; }
    .fb-zone { min-height: 190px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
/* =========================================================
   Соберите помощника
   Модуль 4 · страница «Из чего собран ИИ-помощник».
   Три задачи руководителя: отметить элементы, без которых помощник не справится.
   Зелёный — нужный элемент отмечен, красный — нужной не хватает,
   жёлтый — лишний элемент: допустимо, но усложняет помощника.
   ========================================================= */

var PARTS = [
  { name: 'Инструкция', hint: 'роль, задачи и правила', c: '#C31532' },
  { name: 'Знания', hint: 'ваши файлы: регламенты, шаблоны', c: '#6B5E45' },
  { name: 'Инструменты', hint: 'поиск, почта, CRM-система, таблицы', c: '#1A6B4A' },
  { name: 'Память', hint: 'что сервис помнит из прошлых разговоров', c: '#3B4F72' },
  { name: 'Запуск', hint: 'по расписанию или по событию', c: '#8A6200' },
  { name: 'Проверка человеком', hint: 'кто-то читает результат до отправки', c: '#495761' }
];

/* need — без элемента не обойтись; no — не нужен */
var TASKS = [
  { text: 'Отвечать сотрудникам отдела на вопросы об отпусках, командировках и больничных согласно внутренним регламентам и положениям компании.',
    short: 'Ответы по положениям',
    st: ['need', 'need', 'no', 'no', 'no', 'no'],
    fb: [
      'Роль и правила работы: отвечать только по положениям, указывать пункт, прямо говорить, если ответа в файлах нет.',
      'Положения об отпусках, командировках и больничных — основа всех ответов. Без них ассистент будет отвечать по общим знаниям.',
      'Поиск в интернете здесь не нужен: отвечать нужно по положениям компании. С ним ассистент может подставить общие правила из сети.',
      'Вопросы сотрудников не связаны друг с другом, помнить прошлые разговоры не нужно. Всё, что должно соблюдаться всегда, записано в инструкции и файлах.',
      'Ассистент отвечает, когда сотрудник задаёт вопрос. Расписание и события ему не нужны.',
      'Проверять каждый ответ — лишняя работа, которая съест всю пользу. Достаточно проверить ассистента пятью вопросами перед запуском и вовремя обновлять файлы.'
    ] },
  { text: 'Каждый понедельник в 9:00 выгружать просроченные задачи отдела и присылать вам в мессенджер список с коротким комментарием по каждой задаче — что сорвалось.',
    short: 'Список просроченных задач',
    st: ['need', 'no', 'need', 'no', 'need', 'no'],
    fb: [
      'Пометки к задачам пишет нейросеть, и ей нужны правила: писать одной строкой, только по данным из системы задач, без догадок о причинах.',
      'Данные берутся из системы задач. Отдельные файлы для этой работы не нужны.',
      'Без доступа к системе задач и мессенджеру сценарий не сможет взять данные и отправить вам список.',
      'Каждую неделю список собирается заново по данным системы задач. Помнить прошлые недели не нужно.',
      'Работа начинается сама каждый понедельник в 9:00. Это и есть запуск по расписанию.',
      'Список читаете только вы, и ошибка дальше вас не уйдёт. Отдельная проверка не нужна.'
    ] },
  { text: 'По каждой новой жалобе клиента, которая приходит на почту, найти заказ и договор в CRM-системе и подготовить письмо с извинениями и новым сроком по регламенту работы с жалобами.',
    short: 'Ответы на жалобы',
    st: ['need', 'need', 'need', 'no', 'need', 'need'],
    fb: [
      'Тон письма, что можно обещать клиенту и чего нельзя — это правила, которые должны соблюдаться в каждом письме. Их место в инструкции.',
      'Регламент работы с жалобами: на сколько можно сдвинуть срок и что предложить клиенту. Одно правило вроде «плюс 10 рабочих дней» можно записать в инструкцию, но регламент длиннее, его место в файлах.',
      'Чтобы читать жалобы, помощнику нужен доступ к почте, а чтобы найти заказ и договор — к CRM-системе.',
      'История клиента хранится в CRM-системе. Память сервиса о прошлых разговорах её не заменит и может подмешать чужой случай.',
      'Помощник начинает работу сам, когда на почту приходит жалоба. Это запуск по событию.',
      'Письмо уходит клиенту, и ошибка в сроке обойдётся дорого. Перед отправкой его читает человек.'
    ] }
];

var state = { screen: 'intro', t: 0, pick: [], checked: false, open: -1, results: [] };

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2&nbsp;');
  return s.replace(/ — /g, '&nbsp;— ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1&nbsp;');
}

function grade(k) {
  var st = TASKS[state.t].st[k], p = !!state.pick[k];
  if (st === 'need') return p ? 'ok' : 'miss';
  return p ? 'extra' : 'skip';
}

function partClass(k) {
  if (!state.checked) return 'card card--interactive part' + (state.pick[k] ? ' card--selected' : '');
  var g = grade(k), cls = { ok: 'card--correct', miss: 'card--wrong', extra: 'card--warning', skip: 'part--info' }[g];
  return 'card part part--locked ' + cls + (k === state.open ? ' part--open' : '');
}

function markText(k) {
  if (!state.checked) return state.pick[k] ? '✓' : '';
  return 'Почему? ›';
}

function partHtml(k) {
  var p = PARTS[k];
  return '<div id="part-' + k + '" class="' + partClass(k) + '" style="--c:' + p.c + '" onclick="tap(' + k + ')">'
    + '<div class="part__head"><span class="part__name">' + p.name + '</span><span class="part__mark" id="mark-' + k + '">' + markText(k) + '</span></div>'
    + '<div class="part__hint">' + p.hint + '</div></div>';
}

function counts() {
  var c = { miss: [], extra: [] };
  for (var k = 0; k < PARTS.length; k++) { var g = grade(k); if (g === 'miss') c.miss.push(PARTS[k].name); if (g === 'extra') c.extra.push(PARTS[k].name); }
  return c;
}

function verdictHtml() {
  var c = counts();
  if (!c.miss.length && !c.extra.length) return '<b>Помощник собран точно</b>: всё нужное есть, лишнего нет.';
  if (!c.miss.length) return 'Всё нужное есть. Жёлтым отмечены элементы, без которых помощник проще и надёжнее.';
  return 'Красным отмечены элементы, <b>без которых помощник не справится</b>.';
}

function zoneHtml() {
  if (!state.checked) return '<div class="hint">После проверки здесь появится разбор.</div>';
  var k = state.open, g = grade(k);
  var cls = { ok: 'feedback--success', miss: 'feedback--error', extra: 'feedback--warning', skip: 'feedback--success' }[g];
  var n = '«' + PARTS[k].name + '»';
  var head = { ok: 'Верно · элемент ' + n + ' нужен', miss: 'Неверно · без элемента ' + n + ' не обойтись', extra: 'Допустимо, но… · элемент ' + n + ' здесь лишний',
    skip: 'Верно · элемент ' + n + ' здесь не нужен' }[g];
  return '<p class="verdict">' + verdictHtml() + '</p>'
    + '<div class="feedback ' + cls + '"><div class="feedback__head">' + head + '</div>' + TASKS[state.t].fb[k] + '</div>';
}

function renderIntro() {
  return '<div class="screen__body">'
    + '<h1 class="page-title">Соберите <span>помощника</span></h1>'
    + '<div class="divider"></div>'
    + '<p class="lead-text">Три задачи руководителя. Для каждой задачи отметьте элементы, без которых помощник не справится. Лишние элементы — ошибка: они усложняют настройку и повышают риски. Модель есть в любом помощнике.</p>'
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function progressHtml() {
  var n = state.t + 1;
  return '<div class="progress"><div class="progress__meta"><span class="progress__label">Задача</span>'
    + '<span class="progress__fraction"><em>' + n + '</em> / ' + TASKS.length + '</span></div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (n / TASKS.length * 100) + '%"></div></div></div>';
}

function anyPicked() { for (var k = 0; k < PARTS.length; k++) if (state.pick[k]) return true; return false; }

function renderTask() {
  var parts = '';
  for (var k = 0; k < PARTS.length; k++) parts += partHtml(k);
  var bottom = !state.checked
    ? '<button id="check-btn" class="btn btn--primary btn--full mt-md" onclick="check()"' + (anyPicked() ? '' : ' disabled') + '>Проверить →</button>'
    : '<button class="btn btn--primary btn--full mt-md" onclick="next()">' + (state.t < TASKS.length - 1 ? 'Следующая задача →' : 'К итогам →') + '</button>';
  return '<div class="screen__body">' + progressHtml()
    + '<p class="task">' + TASKS[state.t].text + '</p>'
    + '<p class="note">Какие элементы нужны помощнику для этой задачи?</p>'
    + '<div class="parts">' + parts + '</div>'
    + '<div class="fb-hint mt-md">' + (state.checked ? 'Нажмите на элемент, чтобы увидеть разбор.' : '') + '</div>'
    + '<div id="fbbox" class="fb-zone">' + zoneHtml() + '</div>'
    + '</div>' + bottom;
}

function renderFinal() {
  var rows = '', clean = 0;
  for (var i = 0; i < state.results.length; i++) {
    var r = state.results[i], txt;
    if (!r.miss.length && !r.extra.length) { txt = 'собран точно'; clean++; }
    else {
      var a = [];
      if (r.miss.length) a.push('не хватило: ' + r.miss.join(', ').toLowerCase());
      if (r.extra.length) a.push('лишнее: ' + r.extra.join(', ').toLowerCase());
      txt = a.join('; ');
    }
    rows += '<div class="sum"><b>' + TASKS[i].short + '</b> — ' + txt + '</div>';
  }
  var head = clean === TASKS.length ? 'Вы собираете помощника от задачи' : 'Вы видите, из чего собирают помощника';
  var text = clean === TASKS.length
    ? 'Во всех трёх задачах вы взяли только нужные элементы.'
    : 'Посмотрите, где не хватило элементов или появились лишние.';
  return '<div class="screen__body">'
    + '<div class="result-hero"><div class="result-hero__title">' + head + '</div><div class="result-hero__text">' + text + '</div></div>'
    + rows
    + '<div class="legend-box"><span class="legend-tag">Итог</span>'
    + 'Собирайте помощника от задачи: <strong>что он должен знать</strong> (инструкция и файлы), <strong>что делать</strong> (инструменты), <strong>когда начинать</strong> (запуск) и <strong>где нужен человек</strong>. Всё остальное — лишнее.</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
}

function render() {
  var body = state.screen === 'intro' ? renderIntro() : (state.screen === 'final' ? renderFinal() : renderTask());
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function tap(k) {
  if (!state.checked) {
    state.pick[k] = !state.pick[k];
    document.getElementById('part-' + k).className = partClass(k);
    document.getElementById('mark-' + k).innerHTML = markText(k);
    document.getElementById('check-btn').disabled = !anyPicked();
    notifyHeight();
    return;
  }
  if (k === state.open) return;
  var prev = state.open;
  state.open = k;
  document.getElementById('part-' + prev).className = partClass(prev);
  document.getElementById('part-' + k).className = partClass(k);
  document.getElementById('fbbox').innerHTML = nb(zoneHtml());
  notifyHeight();
}

function firstOpen() {
  var order = ['miss', 'extra', 'ok'];
  for (var o = 0; o < order.length; o++)
    for (var k = 0; k < PARTS.length; k++) if (grade(k) === order[o]) return k;
  return 0;
}

function start() { state.screen = 'task'; state.t = 0; state.pick = []; state.checked = false; state.open = -1; state.results = []; render(); }
function check() { state.checked = true; state.open = firstOpen(); state.results[state.t] = counts(); render(); }
function next() {
  if (state.t < TASKS.length - 1) { state.t++; state.pick = []; state.checked = false; state.open = -1; }
  else state.screen = 'final';
  render();
}
function restart() { state.screen = 'intro'; state.results = []; render(); }

render();
</script>
</body>
</html>
